# CI/CD Pipeline
# Phase 9 - Sprint 3 - Day 13
#
# This workflow handles:
# - Backend linting and testing
# - Frontend linting and testing
# - Security scanning
# - Docker image build and push
# - Deployment triggers

name: CI/CD Pipeline

on:
  push:
    branches: [master, main, develop, staging]
  pull_request:
    branches: [master, main, develop]
  workflow_dispatch:  # Allow manual triggering

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"


jobs:
  # =============================================================================
  # Backend Linting
  # =============================================================================
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install linting tools
        run: |
          cd backend
          pip install ruff bandit

      # Phase 11 Sprint 4: all three gates blocking. Rules pinned in
      # backend/ruff.toml; bandit gates on MEDIUM+ (-ll).
      - name: Syntax gate (compileall)
        run: cd backend && python -m compileall -q app

      - name: Run ruff
        run: cd backend && ruff check .

      - name: Run bandit (MEDIUM+ severity)
        run: cd backend && bandit -r app -q -ll


  # =============================================================================
  # Backend Testing
  # =============================================================================
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install -r requirements-test.txt 2>/dev/null || pip install pytest pytest-cov pytest-asyncio

      # Phase 11 Day 1: syntax regression gate — k8s_agent.py corruption must
      # never reach master again (kills the whole agents package at import).
      - name: Compile gate (compileall)
        run: cd backend && python -m compileall -q app

      - name: Run unit tests
        run: |
          cd backend
          pytest tests/unit/ -v --cov=app --cov-report=term

      - name: Run integration tests
        run: |
          cd backend
          pytest tests/integration/ -v -m "not security"

      # Codecov upload removed 2026-08-29: uploads have always failed
      # (tokenless uploads discontinued) and no dashboard was in use.
      # Coverage still prints in the pytest step above.


  # =============================================================================
  # AI Assistant (review F3: subsystem had no CI and rotted silently)
  # =============================================================================
  ai-assistant-test:
    name: AI Assistant Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd ai_assistant
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        run: |
          cd ai_assistant
          pytest tests/ -v

  # =============================================================================
  # Frontend Linting & Testing
  # =============================================================================
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      # Phase 11 debt cleanup: all three gates blocking (0 eslint errors,
      # 0 tsc errors, 128/128 tests green as of 2026-08-29)
      - name: Run linter
        run: cd frontend && npm run lint
        env:
          CI: true

      - name: Run type check
        run: cd frontend && npx tsc -b

      - name: Run tests
        run: cd frontend && npm run test -- --run
        env:
          CI: true


  # =============================================================================
  # Security Scanning
  # =============================================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Python security scan
      - name: Run Bandit
        run: |
          pip install bandit
          bandit -r backend/app/ -f json -o bandit-report.json || true
          bandit -r backend/app/ -f txt
        continue-on-error: true

      - name: Upload Bandit results
        uses: actions/upload-artifact@v5
        with:
          name: bandit-report
          path: bandit-report.json
        continue-on-error: true

      # Node security audit
      - name: Run npm audit
        run: cd frontend && npm audit --audit-level=high || true
        continue-on-error: true

      # Secrets detection
      - name: TruffleHog - Scan for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          extra_args: --only-verified
        continue-on-error: true

      # Dependency vulnerability scan
      - name: Pip safety check
        run: |
          pip install safety
          cd backend && safety check --json > safety-report.json || true
        continue-on-error: true


  # =============================================================================
  # Performance Benchmarks
  # =============================================================================
  performance-test:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run performance benchmarks
        run: |
          cd backend
          pytest tests/performance/test_benchmarks.py -v -m benchmark || true

      - name: Run Sprint validation
        run: |
          cd backend
          python tests/performance/sprint2_validation.py || true


  # =============================================================================
  # Build and Push Docker Images
  # =============================================================================
  build-and-push:
    name: Build and Push
    needs: [backend-lint, backend-test, frontend-test, security-scan]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        component: [backend, frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.component }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push ${{ matrix.component }}
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.component }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            COMMIT_SHA=${{ github.sha }}

      - name: Image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository }}/${{ matrix.component }}:latest
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true


  # =============================================================================
  # Deploy to Staging (manual)
  # =============================================================================
  deploy-staging:
    name: Deploy to Staging
    needs: [build-and-push]
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.devops-monitoring.internal

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBECONFIG_STAGING }}" | base64 -d > kubeconfig
          export KUBECONFIG=kubeconfig

      - name: Deploy to staging
        run: |
          kubectl set image deployment/backend \
            backend=ghcr.io/${{ github.repository }}/backend:staging-$(git rev-parse --short HEAD) \
            -n devops-monitoring
          kubectl set image deployment/frontend \
            frontend=ghcr.io/${{ github.repository }}/frontend:staging-$(git rev-parse --short HEAD) \
            -n devops-monitoring

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/backend -n devops-monitoring --timeout=5m
          kubectl rollout status deployment/frontend -n devops-monitoring --timeout=5m


  # =============================================================================
  # Deploy to Production (manual approval required)
  # =============================================================================
  deploy-production:
    name: Deploy to Production
    needs: [build-and-push]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://devops-monitoring.internal

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBECONFIG_PROD }}" | base64 -d > kubeconfig
          export KUBECONFIG=kubeconfig

      - name: Deploy to production
        run: |
          kubectl set image deployment/backend \
            backend=ghcr.io/${{ github.repository }}/backend:latest \
            -n devops-monitoring
          kubectl set image deployment/frontend \
            frontend=ghcr.io/${{ github.repository }}/frontend:latest \
            -n devops-monitoring

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/backend -n devops-monitoring --timeout=5m
          kubectl rollout status deployment/frontend -n devops-monitoring --timeout=5m

      - name: Run smoke tests
        run: |
          # Basic health check
          kubectl run smoke-test --image=curlimages/curl:latest --rm -i --restart=Never \
            -- curl -f http://backend.devops-monitoring.svc.cluster.local:8000/api/v1/health || exit 1
