# CI/CD Pipeline
# Phase 9 - Sprint 3 - Day 13
#
# This workflow handles:
# - Backend linting and testing
# - Frontend linting and testing
# - Security scanning
# - Docker image build and push
# - Deployment triggers

name: CI/CD Pipeline

on:
  push:
    branches: [master, main, develop, staging]
  pull_request:
    branches: [master, main, develop]
  workflow_dispatch:  # Allow manual triggering

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

# Deploy jobs push bump commits and kubectl against the same branch — two
# overlapping runs would race the git push and interleave rollouts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false


jobs:
  # =============================================================================
  # Kubernetes Manifest Validation
  # =============================================================================
  # Lightweight syntax gate: every YAML under k8s/ must parse (multi-document
  # files included) and contain only mapping documents. No kustomization
  # files exist in k8s/, so there is no kustomize build to run.
  manifests-validate:
    name: Validate k8s Manifests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Parse all k8s manifests
        run: |
          python - <<'EOF'
          import glob
          import yaml

          files = sorted(glob.glob('k8s/**/*.yaml', recursive=True))
          assert files, "no k8s manifests found"
          docs = 0
          for path in files:
              with open(path) as fh:
                  for doc in yaml.safe_load_all(fh):
                      # None = empty document from a trailing "---" separator
                      # (legal, kubectl tolerates it); anything else must be a mapping.
                      assert doc is None or isinstance(doc, dict), \
                          f"{path}: non-mapping document ({type(doc).__name__})"
                      docs += doc is not None
          print(f"OK: parsed {docs} documents across {len(files)} manifest files")
          EOF


  # =============================================================================
  # Backend Linting
  # =============================================================================
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install linting tools
        run: |
          cd backend
          pip install ruff bandit

      # Phase 11 Sprint 4: all three gates blocking. Rules pinned in
      # backend/ruff.toml; bandit gates on MEDIUM+ (-ll).
      - name: Syntax gate (compileall)
        run: cd backend && python -m compileall -q app

      - name: Run ruff
        run: cd backend && ruff check .

      - name: Run bandit (MEDIUM+ severity)
        run: cd backend && bandit -r app -q -ll


  # =============================================================================
  # Backend Testing
  # =============================================================================
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install -r requirements-test.txt 2>/dev/null || pip install pytest pytest-cov pytest-asyncio

      # Phase 11 Day 1: syntax regression gate — k8s_agent.py corruption must
      # never reach master again (kills the whole agents package at import).
      - name: Compile gate (compileall)
        run: cd backend && python -m compileall -q app

      - name: Run unit tests
        run: |
          cd backend
          pytest tests/unit/ -v --cov=app --cov-report=term

      - name: Run integration tests
        run: |
          cd backend
          pytest tests/integration/ -v -m "not security"

      # Full-repo review 2026-08-30: tests/security/ had no CI job — security
      # validation (webhook replay, CSP, chain limits) only ever ran locally.
      - name: Run security tests
        run: |
          cd backend
          pytest tests/security/ -v

      # Codecov upload removed 2026-08-29: uploads have always failed
      # (tokenless uploads discontinued) and no dashboard was in use.
      # Coverage still prints in the pytest step above.


  # =============================================================================
  # AI Assistant (review F3: subsystem had no CI and rotted silently)
  # =============================================================================
  ai-assistant-test:
    name: AI Assistant Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd ai_assistant
          pip install -r requirements.txt
          pip install pytest pytest-asyncio ruff

      - name: Lint (ruff)
        run: cd ai_assistant && ruff check .

      - name: Run tests
        run: |
          cd ai_assistant
          pytest tests/ -v

  # =============================================================================
  # Frontend Linting & Testing
  # =============================================================================
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      # Phase 11 debt cleanup: all three gates blocking (0 eslint errors,
      # 0 tsc errors, 128/128 tests green as of 2026-08-29)
      - name: Run linter
        run: cd frontend && npm run lint
        env:
          CI: true

      - name: Run type check
        run: cd frontend && npx tsc -b

      - name: Run tests
        run: cd frontend && npm run test -- --run
        env:
          CI: true


  # =============================================================================
  # Security Scanning
  # =============================================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Phase 15: these gates are BLOCKING. They used to be continue-on-error
      # across the board, so nothing here could ever fail the build.
      # backend-lint already runs a blocking `bandit -ll`; safety stays
      # advisory (its DB produces unactionable false positives on pinned
      # versions); npm audit blocks at critical only to stay low-noise.

      # Python security scan
      - name: Run Bandit
        run: |
          pip install bandit
          bandit -r backend/app/ -f json -o bandit-report.json || true
          bandit -r backend/app/ -ll

      - name: Upload Bandit results
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

      # Node security audit
      - name: Run npm audit
        run: cd frontend && npm audit --audit-level=critical

      # Secrets detection
      # Version-pinned refs (was @main/@master floating). Pin to commit SHAs
      # once the repo adopts a full action-pinning policy.
      - name: TruffleHog - Scan for secrets
        uses: trufflesecurity/trufflehog@v3.97.1
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          extra_args: --only-verified

      # Dependency vulnerability scan (advisory — see note above)
      - name: Pip safety check
        run: |
          pip install safety
          cd backend && safety check --json > safety-report.json || true
        continue-on-error: true


  # =============================================================================
  # Performance Benchmarks
  # =============================================================================
  performance-test:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run performance benchmarks
        run: |
          cd backend
          pytest tests/performance/test_benchmarks.py -v -m benchmark || true


  # =============================================================================
  # Build and Push Docker Images
  # =============================================================================
  build-and-push:
    name: Build and Push
    needs: [backend-lint, backend-test, frontend-test, security-scan]
    # master is this repo's default branch — without it here, pushes to master
    # never produced images.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        component: [backend, frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.component }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push ${{ matrix.component }}
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.component }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            COMMIT_SHA=${{ github.sha }}

      - name: Image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}/${{ matrix.component }}:latest
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          # Phase 15: blocking on CRITICAL/HIGH (was continue-on-error)
        continue-on-error: false

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true


  # =============================================================================
  # Deploy to Staging (manual)
  # =============================================================================
  deploy-staging:
    name: Deploy to Staging
    needs: [build-and-push]
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.devops-monitoring.internal
    permissions:
      contents: write   # commit the image-tag bump ArgoCD (selfHeal) deploys from

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBECONFIG_STAGING }}" | base64 -d > kubeconfig
          chmod 600 kubeconfig
          # export does NOT survive across steps; persist via GITHUB_ENV.
          echo "KUBECONFIG=$GITHUB_WORKSPACE/kubeconfig" >> "$GITHUB_ENV"

      - name: Commit image tags to Git
        env:
          IMAGE_TAG: staging-${{ github.sha }}
        run: |
          # One deploy model: Git is the source of truth, ArgoCD selfHeal syncs
          # it. The kubectl set image below only makes the rollout immediate.
          REPO_LC="${GITHUB_REPOSITORY,,}"
          SHORT_SHA="${IMAGE_TAG#staging-}"; SHORT_SHA="${SHORT_SHA:0:7}"
          sed -i "s|image: ghcr.io/.*/backend:.*|image: ${REPO_LC}/backend:staging-${SHORT_SHA}|" k8s/staging/deployment.yaml
          sed -i "s|image: ghcr.io/.*/frontend:.*|image: ${REPO_LC}/frontend:staging-${SHORT_SHA}|" k8s/staging/frontend-deployment.yaml
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add k8s/staging/deployment.yaml k8s/staging/frontend-deployment.yaml
          # [skip ci]: the bump commit must not retrigger this workflow and
          # loop build -> bump -> build forever.
          git commit -m "chore(deploy): staging ${SHORT_SHA} [skip ci]" || echo "no changes"
          git push

      - name: Deploy to staging
        run: |
          # Deployment/container names from k8s/staging/*.yaml (namespace
          # devops-monitor-staging). Read the tag back from the committed
          # manifest — HEAD after the bump commit is the BUMP commit, not the
          # build sha, so `git rev-parse HEAD` here names a tag nobody pushed.
          REPO_LC="${GITHUB_REPOSITORY,,}"
          TAG=$(sed -n 's|.*backend:\(.*\)$|\1|p' k8s/staging/deployment.yaml)
          echo "Deploying backend tag: ${TAG}"
          kubectl set image deployment/backend-staging \
            backend=ghcr.io/${REPO_LC}/backend:${TAG} \
            -n devops-monitor-staging
          kubectl set image deployment/frontend-staging \
            frontend=ghcr.io/${REPO_LC}/frontend:$(sed -n 's|.*frontend:\(.*\)$|\1|p' k8s/staging/frontend-deployment.yaml) \
            -n devops-monitor-staging

      - name: Verify deployment
        run: |
          # Rollback = revert the bump commit (ArgoCD selfHeal would otherwise
          # re-apply the broken tag over any kubectl undo), then undo the
          # rollout for immediate relief.
          rollback() {
            git revert --no-edit HEAD >/dev/null 2>&1 || true
            git commit --amend -m "revert: staging deploy [skip ci]" >/dev/null 2>&1 || true
            git push || true
            kubectl rollout undo deployment/backend-staging -n devops-monitor-staging || true
            kubectl rollout undo deployment/frontend-staging -n devops-monitor-staging || true
          }
          kubectl rollout status deployment/backend-staging -n devops-monitor-staging --timeout=5m || { rollback; exit 1; }
          kubectl rollout status deployment/frontend-staging -n devops-monitor-staging --timeout=5m || { rollback; exit 1; }


  # =============================================================================
  # Deploy to Production (manual approval required)
  # =============================================================================
  deploy-production:
    name: Deploy to Production
    needs: [build-and-push]
    # master is the default branch; keep main so the workflow also works if the
    # repo renames its default branch.
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://devops-monitoring.internal
    permissions:
      contents: write   # commit the image-tag bump ArgoCD (selfHeal) deploys from

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBECONFIG_PROD }}" | base64 -d > kubeconfig
          chmod 600 kubeconfig
          echo "KUBECONFIG=$GITHUB_WORKSPACE/kubeconfig" >> "$GITHUB_ENV"

      - name: Commit image tags to Git
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          # GitOps loop: bump the tag ArgoCD (selfHeal: true, path k8s/backend +
          # k8s/frontend) deploys from, so Git and cluster can never diverge.
          REPO_LC="${GITHUB_REPOSITORY,,}"
          TAG="${BRANCH}-$(git rev-parse --short HEAD)"
          sed -i "s|image: ghcr.io/.*/backend:.*|image: ${REPO_LC}/backend:${TAG}|" k8s/backend/deployment.yaml
          sed -i "s|image: ghcr.io/.*/frontend:.*|image: ${REPO_LC}/frontend:${TAG}|" k8s/frontend/deployment.yaml
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add k8s/backend/deployment.yaml k8s/frontend/deployment.yaml
          # [skip ci]: prevent the build -> bump -> build loop.
          git commit -m "chore(deploy): ${TAG} [skip ci]" || echo "no changes"
          git push

      - name: Deploy to production
        run: |
          # Deployment/container names from k8s/backend/deployment.yaml and
          # k8s/frontend/deployment.yaml (namespace devops-monitor, from
          # k8s/namespace.yaml). Read the tag back from the committed
          # manifest — HEAD is now the bump commit, not the build sha.
          REPO_LC="${GITHUB_REPOSITORY,,}"
          TAG=$(sed -n 's|.*backend:\(.*\)$|\1|p' k8s/backend/deployment.yaml)
          echo "Deploying backend tag: ${TAG}"
          kubectl set image deployment/monitor-backend \
            backend=ghcr.io/${REPO_LC}/backend:${TAG} \
            -n devops-monitor
          kubectl set image deployment/monitor-frontend \
            frontend=ghcr.io/${REPO_LC}/frontend:$(sed -n 's|.*frontend:\(.*\)$|\1|p' k8s/frontend/deployment.yaml) \
            -n devops-monitor

      - name: Verify deployment
        run: |
          # Rollback = revert the bump commit (selfHeal would re-apply the
          # broken tag over a bare kubectl undo), then undo for relief.
          rollback() {
            git revert --no-edit HEAD >/dev/null 2>&1 || true
            git commit --amend -m "revert: production deploy [skip ci]" >/dev/null 2>&1 || true
            git push || true
            kubectl rollout undo deployment/monitor-backend -n devops-monitor || true
            kubectl rollout undo deployment/monitor-frontend -n devops-monitor || true
          }
          kubectl rollout status deployment/monitor-backend -n devops-monitor --timeout=5m || { rollback; exit 1; }
          kubectl rollout status deployment/monitor-frontend -n devops-monitor --timeout=5m || { rollback; exit 1; }

      - name: Run smoke tests
        run: |
          # /health is the app's health route (backend/app/main.py) and is
          # unauthenticated (listed in PUBLIC_PATHS).
          kubectl run smoke-test --image=curlimages/curl:latest --rm -i --restart=Never \
            -- curl -f http://monitor-backend.devops-monitor.svc.cluster.local:8000/health || exit 1
