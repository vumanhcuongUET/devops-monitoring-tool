[pytest]
# Pytest configuration for DevOps AI Agentics 2026

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async test support
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Dump every thread's traceback when a test exceeds 120s, BEFORE the CI job
# timeout kills the run with an opaque exit 143. A hang then names itself
# (the 2026-08-31 CI failure was a stale communicate() mock spinning the
# executor's capped stream reader forever — visible only via this dump).
faulthandler_timeout = 120

# Markers for categorizing tests
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, may require external services)
    api: API endpoint tests
    service: Service layer tests
    alerting: Alerting engine tests
    security: Security hardening tests
    benchmark: Performance benchmark tests (require pytest-benchmark)
    slow: Slow tests (run only with -m slow)

# Coverage options (when using pytest-cov)
[coverage:run]
source = app
omit =
    */tests/*
    */__init__.py
    */migrations/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
