# Phase 11 Sprint 4: blocking lint gate. Error-class pyflakes + bugbear.
# Broad style/flake sets (DTZ, SIM, PERF, RUF...) are advisory only — add
# rules here once the backlog is fixed; do not loosen to make CI pass.
target-version = "py312"
line-length = 100

[lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = [
    "B008", # function call in default arg — FastAPI DI idiom
    "F811", # redefined-while-unused — test mock idiom
]

[lint.per-file-ignores]
"alembic/*" = ["E402"] # sys.path bootstrap must precede imports
"tests/*" = ["E402", "B011", "F841"] # fixture order; assert False idiom; deliberate locals

[lint.isort]
known-first-party = ["app"]
