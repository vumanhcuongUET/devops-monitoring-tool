---
# Global Configuration Defaults
# These defaults apply to all projects unless overridden

# Cache configuration
cache:
  enabled: true
  l1_ttl: 60  # seconds (per-request cache)
  l2_ttl:
    health: 60
    metrics: 300
    pod_status: 180
    alerts: 120
    overview: 300
    triage_card: 600
    semantic: 86400  # 24 hours

# Priority levels (P0 = highest priority)
priorities:
  P0:
    timeout_ms: 5000
    retry_count: 3
    fallback_to_cache: true
  P1:
    timeout_ms: 3000
    retry_count: 2
    fallback_to_cache: true
  P2:
    timeout_ms: 1000
    retry_count: 1
    fallback_to_cache: true
  P3:
    timeout_ms: 500
    retry_count: 0
    fallback_to_cache: true

# Data source priorities
data_sources:
  health_endpoints: P0
  active_alerts: P0
  pod_status: P1
  metrics_current: P1
  logs_recent: P2
  metrics_history: P2
  logs_history: P3
  analytics: P3

# Graceful degradation modes
degradation:
  normal_threshold: 1.0  # 100% sources available
  degraded_threshold: 0.5  # 50% sources available
  emergency_threshold: 0.2  # 20% sources available
  hysteresis: 0.1  # 10% buffer to prevent flapping
  mode_change_cooldown: 300  # 5 minutes

# Critical data types (cached for DR scenarios)
critical_data:
  - health_endpoints
  - active_alerts
  - cluster_status
  - deployment_status
  - service_topology

  refresh_interval: 300  # 5 minutes
  long_ttl: 900  # 15 minutes

# Monitoring and observability
monitoring:
  prometheus:
    enabled: true
    scrape_interval: 30s
  service_monitor:
    enabled: true

# Alert defaults
alerts:
  enabled: true
  default_severity: warning
  notification_channels:
    - slack
    - email

# SLO defaults
slo:
  default_window_days: 30
  default_availability_target: 99.9
  default_latency_target_ms: 500

# Connection pooling
connection_pools:
  elasticsearch:
    limit: 10
    limit_per_host: 5
    keepalive_timeout: 30
  prometheus:
    limit: 10
    limit_per_host: 5
    timeout: 10.0
  kubernetes:
    limit: 5
    timeout: 30.0

# Feature flags
features:
  semantic_cache: true
  query_optimization: true
  streaming_responses: true
  graceful_degradation: true
  config_versioning: true
