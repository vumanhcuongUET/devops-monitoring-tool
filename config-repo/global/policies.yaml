---
# Global Policies
# These policies govern configuration validation and enforcement

# Config validation policies
validation:
  strict_mode: false  # Warn on validation errors, but allow
  require_schemas: true  # Require schema validation for config types
  version_required: true  # Require version field in all configs

# Schema policies
schemas:
  auto_update: false  # Manual schema updates only
  backward_compatible: true  # Maintain backward compatibility

# Versioning policies
versioning:
  strategy: semantic  # Semantic versioning (major.minor.patch)
  max_versions: 10  # Keep last 10 versions
  retention_days: 90  # Keep versions for 90 days

# GitOps policies
gitops:
  branch_strategy:
    main: production
    develop: staging
    feature: development

  require_approval:
    production: true  # Require approval for production changes
    staging: false
    development: false

  auto_sync:
    enabled: true
    interval: 300  # Sync every 5 minutes

  conflict_resolution:
    strategy: manual  # Manual conflict resolution
    notify_on_conflict: true

# Security policies
security:
  encryption:
    enabled: true
    algorithm: AES-256
    key_source: kms  # or vault or env

  secrets:
    allow_in_config: false  # Don't allow secrets in config files
    secret_refs: true  # Allow secret references

  audit:
    enabled: true
    log_all_changes: true
    log_format: json

# RBAC policies
rbac:
  roles:
    viewer:
      can_view: true
      can_edit: false
      can_delete: false
    editor:
      can_view: true
      can_edit: true
      can_delete: false
    admin:
      can_view: true
      can_edit: true
      can_delete: true

  project_roles:
    owner: admin
    maintainer: editor
    viewer: viewer

# Compliance policies
compliance:
  require_change_description: true
  require_author: true
  max_change_size: 1048576  # 1MB max config size

  retention:
    configs: 365  # Keep configs for 1 year
    audit_logs: 2555  # Keep audit logs for 7 years (7 * 365)
    versions: 90  # Keep versions for 90 days

# Integration policies
integrations:
  slack:
    enabled: true
    webhook_url: null  # Set in environment
    notify_on:
      - config_change
      - validation_error
      - deployment

  pagerduty:
    enabled: false
    api_key: null

  opsgenie:
    enabled: false
    api_key: null
