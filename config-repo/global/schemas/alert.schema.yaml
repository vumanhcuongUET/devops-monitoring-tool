---
# Schema for Alert Configuration
# Validates alert rule configurations

type: object
required:
  - name
  - condition
  - severity
properties:
  name:
    type: string
    minLength: 1
    maxLength: 100
    pattern: "^[a-z0-9-]+$"
    description: "Unique alert name"

  display_name:
    type: string
    maxLength: 200
    description: "Human-readable alert name"

  description:
    type: string
    maxLength: 500
    description: "Alert description"

  enabled:
    type: boolean
    default: true
    description: "Enable or disable alert"

  severity:
    type: string
    enum: [critical, warning, info]
    description: "Alert severity level"

  condition:
    type: object
    required:
      - metric
      - operator
      - threshold
    properties:
      metric:
        type: string
        description: "Metric to evaluate"

      operator:
        type: string
        enum: [>, <, >=, <=, ==, !=]

      threshold:
        type: number
        description: "Threshold value"

      duration:
        type: string
        pattern: "^\\d+[smh]$"
        description: "Duration condition must be true (e.g., 5m, 1h)"

      data_source:
        type: string
        enum: [elasticsearch, prometheus, kubernetes]
        description: "Data source for metric"

  evaluation:
    type: object
    properties:
      interval:
        type: string
        pattern: "^\\d+[smh]$"
        default: "1m"
        description: "Evaluation interval"

      delay:
        type: string
        pattern: "^\\d+[smh]$"
        default: "0s"
        description: "Delay before evaluating alert"

  labels:
    type: object
    description: "Additional labels for alert"
    additionalProperties:
      type: string

  annotations:
    type: object
    description: "Alert annotations"
    additionalProperties:
      type: string

  notification:
    type: object
    properties:
      channels:
        type: array
        items:
          type: string
        description: "Notification channels"

      template:
        type: string
        description: "Notification message template"

      include_context:
        type: boolean
        default: true
        description: "Include alert context in notification"

  actions:
    type: array
    description: "Actions to take when alert fires"
    items:
      type: object
      properties:
        type:
          type: string
          enum: [webhook, email, slack, pagerduty]

        target:
          type: string
          description: "Action target (URL, email, etc.)"

        template:
          type: string
          description: "Action template"

  grouping:
    type: object
    properties:
      enabled:
        type: boolean
        default: false

      window:
        type: string
        pattern: "^\\d+[smh]$"
        description: "Grouping window"

      by:
        type: array
        items:
          type: string
        description: "Fields to group by"

  silence:
    type: object
    properties:
      auto_silence:
        type: boolean
        default: false
        description: "Auto-silence repeated alerts"

      duration:
        type: string
        pattern: "^\\d+[smh]$"
        description: "Auto-silence duration"

      max_duplicates:
        type: integer
        minimum: 1
        description: "Max duplicates before silence"

  dependencies:
    type: array
    description: "Other alerts this alert depends on"
    items:
      type: string

  metadata:
    type: object
    properties:
      category:
        type: string
      runbook_url:
        type: string
      tags:
        type: array
        items:
          type: string
