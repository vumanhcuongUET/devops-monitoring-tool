---
# Schema for Deployment Configuration
# Validates deployment-related configurations

type: object
required:
  - deployment
  - health_checks
properties:
  deployment:
    type: object
    required:
      - strategy
    properties:
      strategy:
        type: string
        enum: [rolling, blue_green, canary]
        description: "Deployment strategy"

      replicas:
        type: object
        properties:
          min:
            type: integer
            minimum: 0
          max:
            type: integer
            minimum: 1
          default:
            type: integer
            minimum: 1

      resources:
        type: object
        properties:
          requests:
            type: object
            properties:
              memory:
                type: string
                pattern: "^\\d+(Mi|Gi)$"
              cpu:
                type: string
                pattern: "^\\d+(m|)$"

          limits:
            type: object
            properties:
              memory:
                type: string
                pattern: "^\\d+(Mi|Gi)$"
              cpu:
                type: string
                pattern: "^\\d+(m|)$"

      rollout:
        type: object
        properties:
          timeout_seconds:
            type: integer
            minimum: 60

          max_unavailable:
            type: string
            pattern: "^(\\d+%|\\d+)$"

          max_surge:
            type: string
            pattern: "^(\\d+%|\\d+)$"

  health_checks:
    type: array
    minItems: 1
    items:
      type: object
      required:
        - name
        - path
        - interval
      properties:
        name:
          type: string

        type:
          type: string
          enum: [readiness, liveness, startup]

        path:
          type: string
          pattern: "^/"

        port:
          type: integer
          minimum: 1
          maximum: 65535
          default: 8080

        interval:
          type: string
          pattern: "^\\d+[sm]$"

        timeout:
          type: string
          pattern: "^\\d+[sm]$"
          default: "5s"

        threshold:
          type: integer
          minimum: 1
          default: 3

        headers:
          type: object
          additionalProperties:
            type: string

  rollback:
    type: object
    properties:
      enabled:
        type: boolean
        default: true

      triggers:
        type: array
        items:
          type: object
          properties:
            metric:
              type: string
            condition:
              type: object
              properties:
                operator:
                  type: string
                  enum: [>, <, >=, <=, ==]
                threshold:
                  type: number
            duration:
              type: string
              pattern: "^\\d+[sm]$"

  traffic:
    type: object
    properties:
      splitting:
        type: object
        properties:
          enabled:
            type: boolean

          percentages:
            type: object
            additionalProperties:
              type: number
              minimum: 0
              maximum: 100

      mirroring:
        type: object
        properties:
          enabled:
            type: boolean

          percentage:
            type: number
            minimum: 0
            maximum: 100

          target:
            type: string
