---
# Schema for Monitoring Configuration
# Validates monitoring and observability configurations

type: object
required:
  - service
  - endpoints
properties:
  service:
    type: string
    description: "Service being monitored"

  enabled:
    type: boolean
    default: true

  endpoints:
    type: array
    description: "Monitoring endpoints to scrape"
    items:
      type: object
      required:
        - name
        - port
      properties:
        name:
          type: string

        port:
          type: integer
          minimum: 1
          maximum: 65535

        path:
          type: string
          default: "/metrics"

        scheme:
          type: string
          enum: [http, https]
          default: http

        interval:
          type: string
          pattern: "^\\d+[sm]$"
          default: "30s"

        scrape_timeout:
          type: string
          pattern: "^\\d+[sm]$"
          default: "10s"

  metrics:
    type: object
    properties:
      prometheus:
        type: object
        properties:
          enabled:
            type: boolean

          scrape_interval:
            type: string
            pattern: "^\\d+[sm]$"

          scrape_timeout:
            type: string
            pattern: "^\\d+[sm]$"

          sample_limit:
            type: integer
            minimum: 0

          relabel_configs:
            type: array
            items:
              type: object

      elasticsearch:
        type: object
        properties:
          enabled:
            type: boolean

          index_patterns:
            type: array
            items:
              type: string

          query_interval:
            type: string
            pattern: "^\\d+[sm]$"

  tracing:
    type: object
    properties:
      enabled:
        type: boolean

      sampling_rate:
        type: number
        minimum: 0
        maximum: 1

      exporter:
        type: string
        enum: [jaeger, zipkin, otlp]

      endpoint:
        type: string
        format: uri

  logging:
    type: object
    properties:
      enabled:
        type: boolean

      level:
        type: string
        enum: [debug, info, warn, error]
        default: info

      format:
        type: string
        enum: [json, text]
        default: json

      outputs:
        type: array
        items:
          type: string
          enum: [stdout, elasticsearch, loki]

  dashboards:
    type: array
    description: "Grafana dashboard configurations"
    items:
      type: object
      properties:
        name:
          type: string

        template:
          type: string

        refresh_interval:
          type: string
          pattern: "^\\d+[sm]$"

        variables:
          type: array
          items:
            type: object

  alerts:
    type: object
    properties:
      enabled:
        type: boolean

      rules:
        type: array
        items:
          type: object

      groups:
        type: array
        items:
          type: object
          properties:
            name:
              type: string

            interval:
              type: string
              pattern: "^\\d+[sm]$"

            rules:
              type: array

  recording_rules:
    type: array
    description: "Prometheus recording rules"
    items:
      type: object
      properties:
        name:
          type: string

        query:
          type: string

        interval:
          type: string
          pattern: "^\\d+[sm]$"

  annotations:
    type: object
    properties:
      deployment_markers:
        type: boolean
        default: true
        description: "Add deployment markers to graphs"

      downtime_markers:
        type: boolean
        default: true

      custom:
        type: object
        additionalProperties:
          type: string
