---
# Schema for Project Configuration
# Validates project-specific configuration files

type: object
required:
  - project
  - version
  - monitoring
properties:
  project:
    type: object
    required:
      - name
      - environment
    properties:
      name:
        type: string
        minLength: 1
        maxLength: 100
        pattern: "^[a-z0-9-]+$"
        description: "Project name (lowercase, alphanumeric, hyphens only)"

      display_name:
        type: string
        maxLength: 200
        description: "Human-readable project name"

      environment:
        type: string
        enum: [development, staging, production]
        description: "Deployment environment"

      description:
        type: string
        maxLength: 500
        description: "Project description"

      owner:
        type: string
        format: email
        description: "Project owner email"

      team:
        type: string
        description: "Team responsible for project"

      tags:
        type: object
        description: "Project tags for organization"
        additionalProperties:
          type: string

  version:
    type: string
    pattern: "^\\d+\\.\\d+\\.\\d+$"
    description: "Configuration version (semantic versioning)"

  monitoring:
    type: object
    required:
      - enabled
    properties:
      enabled:
        type: boolean
        description: "Enable monitoring for project"

      elasticsearch:
        type: object
        properties:
          enabled:
            type: boolean
          url:
            type: string
            format: uri
          index_pattern:
            type: string
            pattern: "^[a-z0-9-*]+$"
          username:
            type: string
          password_ref:
            type: string
            description: "Reference to secret containing password"

      prometheus:
        type: object
        properties:
          enabled:
            type: boolean
          url:
            type: string
            format: uri
          username:
            type: string
          password_ref:
            type: string

      kubernetes:
        type: object
        properties:
          enabled:
            type: boolean
          context:
            type: string
          namespaces:
            type: array
            items:
              type: string
              pattern: "^[a-z0-9-]+$"

  caching:
    type: object
    properties:
      enabled:
        type: boolean

      ttl_overrides:
        type: object
        description: "Override default TTLs for this project"
        additionalProperties:
          type: integer
          minimum: 0

      cache_warming:
        type: object
        properties:
          enabled:
            type: boolean
          interval_seconds:
            type: integer
            minimum: 60
            maximum: 3600

  priorities:
    type: object
    description: "Override default data source priorities"
    additionalProperties:
      type: string
      enum: [P0, P1, P2, P3]

  slo:
    type: array
    description: "SLO configurations for project"
    items:
      type: object
      required:
        - slo_name
        - service
        - objectives
      properties:
        slo_name:
          type: string
        service:
          type: string
        objectives:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              target:
                type: number
                minimum: 0
                maximum: 100
              window:
                type: object
                properties:
                  duration:
                    type: string
                  rolling:
                    type: boolean

  alerts:
    type: array
    description: "Alert rules for project"
    items:
      type: object
      required:
        - name
        - condition
      properties:
        name:
          type: string
        severity:
          type: string
          enum: [critical, warning, info]
        condition:
          type: string
        notification_channels:
          type: array
          items:
            type: string

  created_at:
    type: string
    format: date-time
    readOnly: true

  updated_at:
    type: string
    format: date-time
    readOnly: true

  created_by:
    type: string
    readOnly: true

  updated_by:
    type: string
    readOnly: true
