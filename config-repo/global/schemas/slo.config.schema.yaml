---
# Schema for SLO Configuration
# Validates Service Level Objective configurations

type: object
required:
  - slo_name
  - service
  - objectives
properties:
  slo_name:
    type: string
    minLength: 1
    maxLength: 100
    pattern: "^[a-z0-9-]+$"
    description: "Unique SLO name"

  display_name:
    type: string
    maxLength: 200
    description: "Human-readable SLO name"

  description:
    type: string
    maxLength: 500
    description: "SLO description"

  service:
    type: string
    description: "Service this SLO applies to"

  enabled:
    type: boolean
    default: true

  objectives:
    type: array
    minItems: 1
    items:
      type: object
      required:
        - name
        - target
        - window
      properties:
        name:
          type: string
          enum: [availability, latency, error_rate, throughput]
          description: "Objective type"

        display_name:
          type: string
          maxLength: 200

        target:
          type: number
          minimum: 0
          maximum: 100
          description: "Target percentage (0-100)"

        window:
          type: object
          required:
            - duration
            - rolling
          properties:
            duration:
              type: string
              pattern: "^\\d+[dwmy]$"
              description: "Window duration (e.g., 7d, 30d)"

            rolling:
              type: boolean
              description: "True for rolling window, false for calendar"

        threshold:
          type: number
          minimum: 0
          maximum: 100
          description: "Alert threshold percentage"

        latency_target_ms:
          type: number
          minimum: 0
          description: "Latency target in milliseconds (for latency objectives)"

        latency_percentile:
          type: number
          minimum: 0
          maximum: 100
          default: 95
          description: "Latency percentile (e.g., 95 for p95)"

  error_budget:
    type: object
    properties:
      enabled:
        type: boolean
        default: true

      burn_rate_alert:
        type: boolean
        default: true

      burn_rate_threshold:
        type: number
        minimum: 1
        default: 2
        description: "Alert when error budget burns at N times normal rate"

      remaining_notification:
        type: number
        minimum: 0
        maximum: 100
        default: 10
        description: "Notify when error budget remaining below X%"

  reporting:
    type: object
    properties:
      enabled:
        type: boolean
        default: true

      channels:
        type: array
        items:
          type: string

      schedule:
        type: string
        pattern: "^\\d{2}:\\d{2}$"
        description: "Daily report time (HH:MM)"

      timezone:
        type: string
        default: "UTC"

      include_recommendations:
        type: boolean
        default: true

  tags:
    type: array
    items:
      type: string

  metadata:
    type: object
    properties:
      category:
        type: string
      owner:
        type: string
      runbook_url:
        type: string
      documentation_url:
        type: string
