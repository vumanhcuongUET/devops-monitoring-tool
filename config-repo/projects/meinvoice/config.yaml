---
# MeInvoice Project Configuration
# Environment: Staging

version: 1.0.0

project:
  name: meinvoice
  display_name: "MeInvoice E-Commerce Platform"
  environment: staging
  description: "E-commerce invoice management and processing platform"
  owner: "devops@example.com"
  team: "platform-team"
  tags:
    domain: ecommerce
    tier: critical
    region: ap-southeast-1

monitoring:
  enabled: true

  elasticsearch:
    enabled: true
    url: "https://elasticsearch.example.com:9200"
    index_pattern: "meinvoice-*"
    username: "meinvoice_user"
    password_ref: "secret/meinvoice-es-password"

  prometheus:
    enabled: true
    url: "https://prometheus.example.com"
    username: "meinvoice_user"
    password_ref: "secret/meinvoice-prom-password"

  kubernetes:
    enabled: true
    context: "staging-cluster"
    namespaces:
      - meinvoice-staging
      - meinvoice-worker-staging

caching:
  enabled: true
  ttl_overrides:
    overview: 600  # 10 minutes for overview
    triage_card: 1200  # 20 minutes for triage cards

  cache_warming:
    enabled: true
    interval_seconds: 300  # 5 minutes

priorities:
  health_endpoints: P0
  active_alerts: P0
  pod_status: P1
  metrics_current: P1
  logs_recent: P2
  metrics_history: P2

slo:
  - slo_name: meinvoice-api-availability
    service: meinvoice-api
    description: "API availability SLO"
    enabled: true
    objectives:
      - name: availability
        display_name: "API Availability"
        target: 99.9
        window:
          duration: 30d
          rolling: true
        threshold: 99.5

      - name: latency
        display_name: "API Latency"
        target: 95
        window:
          duration: 7d
          rolling: true
        threshold: 90
        latency_target_ms: 500
        latency_percentile: 95

    error_budget:
      enabled: true
      burn_rate_alert: true
      burn_rate_threshold: 2
      remaining_notification: 10

    reporting:
      enabled: true
      channels:
        - "#meinvoice-slo"
      schedule: "09:00"
      timezone: "Asia/Ho_Chi_Minh"
      include_recommendations: true

    tags:
      - api
      - availability
      - latency

    metadata:
      category: performance
      owner: "platform-team@example.com"
      runbook_url: "https://runbooks.example.com/meinvoice-api"

alerts:
  - name: meinvoice-high-error-rate
    display_name: "High API Error Rate"
    description: "Alert when API error rate exceeds threshold"
    enabled: true
    severity: critical
    condition:
      metric: "error_rate"
      operator: ">"
      threshold: 0.05
      duration: "5m"
      data_source: prometheus
    evaluation:
      interval: "1m"
    notification:
      channels:
        - slack
        - pagerduty
      template: "API error rate is {{value}}% for {{duration}}"
      include_context: true
    labels:
      service: meinvoice-api
      tier: critical
    annotations:
      runbook: "https://runbooks.example.com/meinvoice-errors"

  - name: meinvoice-high-latency
    display_name: "High API Latency"
    description: "Alert when API latency exceeds threshold"
    enabled: true
    severity: warning
    condition:
      metric: "latency_p95"
      operator: ">"
      threshold: 1000
      duration: "10m"
      data_source: prometheus
    evaluation:
      interval: "1m"
    notification:
      channels:
        - slack
      template: "P95 latency is {{value}}ms"
    labels:
      service: meinvoice-api

  - name: meinvoice-pod-crashloop
    display_name: "Pod CrashLooping"
    description: "Alert when pods are in crash loop"
    enabled: true
    severity: critical
    condition:
      metric: "kube_pod_container_status_restarts_total"
      operator: ">"
      threshold: 5
      duration: "5m"
      data_source: prometheus
    evaluation:
      interval: "1m"
    notification:
      channels:
        - slack
        - pagerduty
    labels:
      resource: pod

created_at: "2026-08-23T00:00:00Z"
updated_at: "2026-08-23T00:00:00Z"
created_by: "platform-admin"
updated_by: "platform-admin"
