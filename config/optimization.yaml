# Phase 6: AI Input Optimization Configuration
# Production-ready configuration for Sprint 1

optimization:
  # Master switch
  enabled: true

  # Fallback to baseline on error
  fallback_on_error: true

  # Default token budget
  default_budget: 2000

  # Maximum processing overhead (ms)
  max_overhead_ms: 100

# Strategy Configuration
strategies:
  anomaly_detection:
    enabled: true
    priority: 1  # Run first

    thresholds:
      cpu:
        high: 80
        critical: 90
        low: 20
      memory:
        high: 85
        critical: 95
      disk:
        high: 90
        critical: 95
      network_io:
        high_multiplier: 3.0
        critical_multiplier: 5.0
      disk_io:
        high_multiplier: 3.0
        critical_multiplier: 5.0
      error_rate:
        high: 5
        critical: 10

    # Minimum samples for baseline calculation
    min_baseline_samples: 3
    baseline_window: 10

  smart_sampling:
    enabled: true
    priority: 2  # Run second

    # Sampling quotas
    quotas:
      critical: 5
      error: 10
      warning: 10
      info: 5

    # Relevance scoring weights
    weights:
      keyword: 0.4
      temporal: 0.3
      severity: 0.2
      service: 0.1

    # Temporal windows (minutes)
    temporal_windows:
      full_score: 5      # Within 5 min: 1.0
      high_score: 15     # Within 15 min: 0.7
      medium_score: 30   # Within 30 min: 0.4
      low_score: 60      # Within 60 min: 0.2

    max_results_per_source: 20

  time_series_compression:
    enabled: true
    priority: 3  # Run third

    # Percentiles to calculate
    percentiles: [50, 90, 95, 99]

    # Trend detection
    trend_detection:
      window_size: 5
      volatility_threshold: 0.3
      change_threshold: 0.1

    include_percentiles: true
    include_trend: true
    include_minmax: true

  relevance_filtering:
    enabled: true
    priority: 4  # Run fourth

    min_relevance_score: 0.3
    max_results_per_source: 20

# Quality Gates
quality:
  validate_accuracy: true

  # Minimum accuracy thresholds
  thresholds:
    finding_recall: 0.90
    finding_precision: 0.85
    severity_accuracy: 0.95

  # Fail if below thresholds
  enforce_thresholds: false  # Will enforce in Sprint 2

# Token Budgeting
budgets:
  # Base budgets by severity
  by_severity:
    critical: 3000
    high: 2500
    medium: 2000
    low: 1500
    info: 1000

  # Complexity multiplier (0.0 to 0.4)
  complexity_multiplier: 0.2

  # Maximum budget (hard limit)
  max_budget: 5000

# Monitoring
monitoring:
  # Track all requests
  track_all_requests: true

  # Storage path for metrics
  metrics_storage: "data/optimization_metrics.jsonl"

  # Retention (days)
  metrics_retention_days: 30

  # Enable performance tracking
  track_performance: true

# Feature Flags
features:
  # Enable A/B testing (Sprint 2)
  ab_testing_enabled: false

  # A/B test ratio (0.0 to 1.0)
  ab_test_ratio: 0.1

  # Enable relevance scoring (Sprint 3)
  relevance_scoring_enabled: false

  # Enable dynamic budgeting (Sprint 3)
  dynamic_budgeting_enabled: false
