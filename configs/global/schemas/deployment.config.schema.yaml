# Deployment Configuration Schema
type: object
properties:
  deployment:
    type: object
    properties:
      strategy:
        type: string
        enum:
          - rolling
          - blue_green
          - canary
        default: rolling
        description: Deployment strategy

      replicas:
        type: object
        properties:
          min:
            type: integer
            minimum: 0
            default: 1
            description: Minimum number of replicas
          max:
            type: integer
            minimum: 1
            default: 10
            description: Maximum number of replicas
          default:
            type: integer
            minimum: 1
            default: 3
            description: Default replica count

      resources:
        type: object
        properties:
          requests:
            type: object
            properties:
              cpu:
                type: string
                pattern: '^\d+m?$'
                description: CPU request (e.g., 500m, 1)
              memory:
                type: string
                pattern: '^\d+[MiGi]+$'
                description: Memory request (e.g., 512Mi, 1Gi)

          limits:
            type: object
            properties:
              cpu:
                type: string
                pattern: '^\d+m?$'
                description: CPU limit (e.g., 1000m, 2)
              memory:
                type: string
                pattern: '^\d+[MiGi]+$'
                description: Memory limit (e.g., 1Gi, 2Gi)

      autoscaling:
        type: object
        properties:
          enabled:
            type: boolean
            default: false
          min_replicas:
            type: integer
            minimum: 1
            default: 2
          max_replicas:
            type: integer
            minimum: 1
            default: 10
          target_cpu_utilization:
            type: integer
            minimum: 1
            maximum: 100
            default: 70
          target_memory_utilization:
            type: integer
            minimum: 1
            maximum: 100
            default: 80

  health_checks:
    type: array
    items:
      type: object
      properties:
        name:
          type: string
        path:
          type: string
          pattern: '^/.*'
          description: Health check endpoint path
        port:
          type: integer
          minimum: 1
          maximum: 65535
          default: 8000
        interval:
          type: string
          pattern: '^\d+[sm]$'
          default: 30s
        timeout:
          type: string
          pattern: '^\d+[sm]$'
          default: 5s
        threshold:
          type: integer
          minimum: 1
          default: 3
          description: Consecutive failures before marking unhealthy

  rollout:
    type: object
    properties:
      max_unavailable:
        type: string
        pattern: '^\d+%?$'
        default: 25%
        description: Maximum unavailable pods during rollout
      max_surge:
        type: string
        pattern: '^\d+%?$'
        default: 25%
        description: Maximum surge pods during rollout
      revision_history_limit:
        type: integer
        minimum: 0
        default: 10
        description: Number of old ReplicaSets to retain

  containers:
    type: array
    items:
      type: object
      properties:
        name:
          type: string
        image:
          type: string
          description: Container image (e.g., repo/image:tag)
        ports:
          type: array
          items:
            type: object
            properties:
              container_port:
                type: integer
                minimum: 1
                maximum: 65535
              protocol:
                type: string
                enum:
                  - TCP
                  - UDP
                default: TCP
        env:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              value:
                type: string
              value_from:
                type: object
                description: Value from secret/config map
