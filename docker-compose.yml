services:
  # Optional Redis for distributed state (alert/approval/rate-limit).
  # Enable with: docker compose --profile redis up
  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    ports:
      # Loopback only — an unauthenticated Redis published on 0.0.0.0 is a
      # classic pivot target.
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks:
      - backend-net

  backend:
    # nginx (frontend image) proxies to http://monitor-backend:8000 — the
    # same name as the k8s Service. Keep both in sync.
    container_name: monitor-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - alert-data:/app/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    networks:
      - backend-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    networks:
      - backend-net
      - frontend-net

volumes:
  alert-data:
  redis-data:

networks:
  backend-net:
    driver: bridge
    internal: false
  frontend-net:
    driver: bridge
