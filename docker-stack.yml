# Docker Swarm stack for DevOps AI Agentics 2026.
# Deploy from a manager node (variables come from the shell environment —
# source .env first, docker stack deploy does NOT read env_file):
#   set -a; source /opt/devops-monitor/.env; set +a
#   docker stack deploy -c docker-stack.yml monitor --with-registry-auth
#
# Swarm subset only: no build:, no env_file:, no depends_on (ignored by stack deploy).

services:
  monitor-backend:
    image: ${REGISTRY}/devops-monitor-backend:${TAG:-latest}
    environment:
      # Data sources (required)
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:?set in .env}
      ELASTICSEARCH_USERNAME: ${ELASTICSEARCH_USERNAME:?set in .env}
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD:?set in .env}
      ELASTICSEARCH_INDEX_PATTERN: ${ELASTICSEARCH_INDEX_PATTERN:-logs-*}
      APM_INDEX_PATTERN: ${APM_INDEX_PATTERN:-apm-*}
      PROMETHEUS_URL: ${PROMETHEUS_URL:?set in .env}
      # K8s integration is optional on Swarm: mount a kubeconfig to enable
      KUBECONFIG_PATH: ${KUBECONFIG_PATH:-}
      K8S_NAMESPACES: ${K8S_NAMESPACES:-[]}
      # Auth (required — see docs/security-review-2026-08-20.md)
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      AUTH_SECRET: ${AUTH_SECRET:?generate with python3 -c "import secrets; print(secrets.token_hex(32))"}
      API_KEYS: ${API_KEYS:?comma-separated list}
      AUTH_TOKEN_TTL_SECONDS: ${AUTH_TOKEN_TTL_SECONDS:-900}
      # In-stack services (see monitor-redis / monitor-postgres below)
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set in .env}
      ALERT_STATE_USE_REDIS: "true"
      APPROVAL_STATE_USE_REDIS: "true"
      RATE_LIMIT_USE_REDIS: "true"
      DATABASE_ENABLED: ${DATABASE_ENABLED:-true}
      DATABASE_HOST: postgres
      DATABASE_NAME: ${DATABASE_NAME:-devops_monitor}
      DATABASE_USER: ${DATABASE_USER:-devops}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?set in .env}
      # Notifications / AI
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-[]}
    volumes:
      - alert-data:/app/data
      # Optional kubeconfig for the K8s client (bind path must exist on the
      # node this task lands on — same constraint as the data services):
      # - /opt/devops-monitor/kubeconfig:/run/kubeconfig:ro
    networks:
      - backend-net
      - frontend-net # frontend nginx proxies to http://monitor-backend:8000
    deploy:
      # H1 (2026-08-29 review): AlertEngine is in-process, WS broadcast is
      # pod-local — 2 replicas duplicate alerts and drop realtime events.
      # Split out an alert-worker + Redis pub/sub before raising this.
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
      placement:
        constraints:
          - node.labels.devops-monitor.data == true

  monitor-frontend:
    image: ${REGISTRY}/devops-monitor-frontend:${TAG:-latest}
    networks:
      - frontend-net
    ports:
      - "80:80"
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  redis:
    image: redis:7.2-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set in .env}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a '${REDIS_PASSWORD}' ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.devops-monitor.data == true
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  postgres:
    image: timescale/timescaledb:2-pg16
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-devops_monitor}
      POSTGRES_USER: ${DATABASE_USER:-devops}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set in .env}
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-devops} -d ${DATABASE_NAME:-devops_monitor}"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.devops-monitor.data == true
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

volumes:
  alert-data:
  redis-data:
  pg-data:

networks:
  backend-net:
    driver: overlay
    internal: true
  frontend-net:
    driver: overlay
