<svg width="1200" height="700" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#0f172a"/>

  <!-- Header -->
  <rect width="100%" height="60" fill="#1e293b"/>
  <text x="20" y="38" fill="#f1f5f9" font-family="sans-serif" font-size="18" font-weight="bold">
    DevOps AI Agentics 2026
  </text>
  <circle cx="1150" cy="30" r="8" fill="#22c55e"/>
  <text x="1135" y="34" fill="#22c55e" font-family="sans-serif" font-size="11">LIVE</text>

  <!-- Sidebar Navigation -->
  <rect x="0" y="60" width="200" height="640" fill="#1e293b"/>
  <text x="30" y="100" fill="#3b82f6" font-family="sans-serif" font-size="14">● Overview</text>
  <text x="30" y="140" fill="#94a3b8" font-family="sans-serif" font-size="14">  Logs</text>
  <text x="30" y="180" fill="#94a3b8" font-family="sans-serif" font-size="14">  APM</text>
  <text x="30" y="220" fill="#94a3b8" font-family="sans-serif" font-size="14">  Infrastructure</text>
  <text x="30" y="260" fill="#94a3b8" font-family="sans-serif" font-size="14">  SLOs</text>
  <text x="30" y="300" fill="#94a3b8" font-family="sans-serif" font-size="14">  Actions</text>
  <text x="30" y="340" fill="#94a3b8" font-family="sans-serif" font-size="14">  Settings</text>

  <!-- Main Content Area -->
  <rect x="200" y="60" width="1000" height="640" fill="#0f172a"/>

  <!-- Page Title -->
  <text x="230" y="95" fill="#f1f5f9" font-family="sans-serif" font-size="24" font-weight="bold">
    Overview Dashboard
  </text>

  <!-- Stats Row -->
  <rect x="230" y="120" width="220" height="100" rx="8" fill="#1e293b"/>
  <text x="250" y="150" fill="#94a3b8" font-family="sans-serif" font-size="12">Total Systems</text>
  <text x="250" y="185" fill="#f1f5f9" font-family="sans-serif" font-size="28" font-weight="bold">8</text>
  <circle cx="420" cy="185" r="6" fill="#22c55e"/>

  <rect x="470" y="120" width="220" height="100" rx="8" fill="#1e293b"/>
  <text x="490" y="150" fill="#94a3b8" font-family="sans-serif" font-size="12">Active Alerts</text>
  <text x="490" y="185" fill="#ef4444" font-family="sans-serif" font-size="28" font-weight="bold">3</text>

  <rect x="710" y="120" width="220" height="100" rx="8" fill="#1e293b"/>
  <text x="730" y="150" fill="#94a3b8" font-family="sans-serif" font-size="12">SLO Health</text>
  <text x="730" y="185" fill="#22c55e" font-family="sans-serif" font-size="28" font-weight="bold">98.5%</text>

  <rect x="950" y="120" width="220" height="100" rx="8" fill="#1e293b"/>
  <text x="970" y="150" fill="#94a3b8" font-family="sans-serif" font-size="12">Incidents (24h)</text>
  <text x="970" y="185" fill="#f1f5f9" font-family="sans-serif" font-size="28" font-weight="bold">2</text>

  <!-- System Health Section -->
  <text x="230" y="255" fill="#f1f5f9" font-family="sans-serif" font-size="16" font-weight="bold">
    System Health
  </text>

  <!-- Project Cards -->
  <!-- meinvoice -->
  <rect x="230" y="275" width="280" height="120" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="250" y="300" fill="#f1f5f9" font-family="sans-serif" font-size="14" font-weight="bold">meinvoice</text>
  <circle cx="470" cy="295" r="5" fill="#22c55e"/>
  <text x="250" y="325" fill="#94a3b8" font-family="sans-serif" font-size="12">Production</text>
  <text x="250" y="345" fill="#94a3b8" font-family="sans-serif" font-size="12">Pods: 12/12 • API: 99.9%</text>
  <text x="250" y="365" fill="#94a3b8" font-family="sans-serif" font-size="12">SLO: On track</text>
  <text x="250" y="385" fill="#22c55e" font-family="sans-serif" font-size="11">● All systems operational</text>

  <!-- erp-system -->
  <rect x="530" y="275" width="280" height="120" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="550" y="300" fill="#f1f5f9" font-family="sans-serif" font-size="14" font-weight="bold">erp-system</text>
  <circle cx="770" cy="295" r="5" fill="#f59e0b"/>
  <text x="550" y="325" fill="#94a3b8" font-family="sans-serif" font-size="12">Staging</text>
  <text x="550" y="345" fill="#94a3b8" font-family="sans-serif" font-size="12">Pods: 8/10 • API: 98.2%</text>
  <text x="550" y="365" fill="#94a3b8" font-family="sans-serif" font-size="12">SLO: At risk</text>
  <text x="550" y="385" fill="#f59e0b" font-family="sans-serif" font-size="11">● 2 pods not ready</text>

  <!-- mobile-app -->
  <rect x="830" y="275" width="280" height="120" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  <text x="850" y="300" fill="#f1f5f9" font-family="sans-serif" font-size="14" font-weight="bold">mobile-app</text>
  <circle cx="1070" cy="295" r="5" fill="#ef4444"/>
  <text x="850" y="325" fill="#94a3b8" font-family="sans-serif" font-size="12">Production</text>
  <text x="850" y="345" fill="#94a3b8" font-family="sans-serif" font-size="12">Pods: 3/8 • API: 94.1%</text>
  <text x="850" y="365" fill="#94a3b8" font-family="sans-serif" font-size="12">SLO: Breaching</text>
  <text x="850" y="385" fill="#ef4444" font-family="sans-serif" font-size="11">● High error rate detected</text>

  <!-- Active Alerts Section -->
  <text x="230" y="430" fill="#f1f5f9" font-family="sans-serif" font-size="16" font-weight="bold">
    Active Alerts
  </text>

  <!-- Alert Items -->
  <rect x="230" y="450" width="940" height="60" rx="8" fill="#1e293b"/>
  <rect x="230" y="450" width="4" height="60" rx="2" fill="#ef4444"/>
  <text x="250" y="470" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="bold">mobile-app: High error rate</text>
  <text x="250" y="490" fill="#ef4444" font-family="sans-serif" font-size="11">CRITICAL</text>
  <text x="330" y="490" fill="#94a3b8" font-family="sans-serif" font-size="11">Error rate: 5.9% (threshold: 1%)</text>
  <text x="1050" y="480" fill="#94a3b8" font-family="sans-serif" font-size="11">2 min ago</text>

  <rect x="230" y="520" width="940" height="60" rx="8" fill="#1e293b"/>
  <rect x="230" y="520" width="4" height="60" rx="2" fill="#f59e0b"/>
  <text x="250" y="540" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="bold">erp-system: Pod restarts</text>
  <text x="250" y="560" fill="#f59e0b" font-family="sans-serif" font-size="11">WARNING</text>
  <text x="330" y="560" fill="#94a3b8" font-family="sans-serif" font-size="11">2 pods in CrashLoopBackOff</text>
  <text x="1050" y="550" fill="#94a3b8" font-family="sans-serif" font-size="11">15 min ago</text>

  <rect x="230" y="590" width="940" height="60" rx="8" fill="#1e293b"/>
  <rect x="230" y="590" width="4" height="60" rx="2" fill="#22c55e"/>
  <text x="250" y="610" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="bold">meinvoice: SLO warning</text>
  <text x="250" y="630" fill="#22c55e" font-family="sans-serif" font-size="11">INFO</text>
  <text x="310" y="630" fill="#94a3b8" font-family="sans-serif" font-size="11">Latency approaching SLO threshold</text>
  <text x="1050" y="620" fill="#94a3b8" font-family="sans-serif" font-size="11">1 hour ago</text>

  <!-- Footer -->
  <rect x="200" y="700" width="1000" height="40" fill="#1e293b"/>
  <text x="230" y="725" fill="#64748b" font-family="sans-serif" font-size="11">
    Last updated: Just now • WebSocket connected • Data from 4 sources
  </text>
</svg>
