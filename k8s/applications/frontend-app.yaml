---
# Frontend Application
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-monitor-frontend
  namespace: argocd
  labels:
    app.kubernetes.io/name: devops-monitor-frontend
    app.kubernetes.io/component: frontend
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: devops-monitor

  source:
    repoURL: https://github.com/vumanhcuongUET/devops-monitoring-tool
    targetRevision: master
    path: k8s/frontend

  destination:
    server: https://kubernetes.default.svc
    namespace: devops-monitor

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true

---
# Frontend Application (Staging)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-monitor-frontend-staging
  namespace: argocd
  labels:
    app.kubernetes.io/name: devops-monitor-frontend-staging
    app.kubernetes.io/component: frontend
    app.kubernetes.io/environment: staging
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: devops-monitor

  source:
    repoURL: https://github.com/vumanhcuongUET/devops-monitoring-tool
    # Staging tracks the staging branch; CI commits image-tag bumps into
    # k8s/staging/*.yaml (plain manifests, no kustomization.yaml exists).
    # REQUIRES a `staging` branch to exist in this repo — create it before
    # applying this Application, or it can never sync.
    targetRevision: staging
    path: k8s/staging

  destination:
    server: https://kubernetes.default.svc
    namespace: devops-monitor-staging

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
