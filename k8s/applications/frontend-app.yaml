---
# Frontend Application
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-monitor-frontend
  namespace: argocd
  labels:
    app.kubernetes.io/name: devops-monitor-frontend
    app.kubernetes.io/component: frontend
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: devops-monitor

  source:
    repoURL: https://github.com/vumanhcuongUET/devops-monitoring-tool
    targetRevision: main
    path: k8s/frontend

  destination:
    server: https://kubernetes.default.svc
    namespace: devops-monitor

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true

---
# Frontend Application (Staging)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-monitor-frontend-staging
  namespace: argocd
  labels:
    app.kubernetes.io/name: devops-monitor-frontend-staging
    app.kubernetes.io/component: frontend
    app.kubernetes.io/environment: staging
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: devops-monitor

  source:
    repoURL: https://github.com/vumanhcuongUET/devops-monitoring-tool
    targetRevision: main
    path: k8s/frontend
    kustomize:
      images:
        - name: devops-monitor-frontend
          newTag: staging

  destination:
    server: https://kubernetes.default.svc
    namespace: devops-monitor-staging

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true

---
# Frontend Application (Production)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-monitor-frontend-prod
  namespace: argocd
  labels:
    app.kubernetes.io/name: devops-monitor-frontend-prod
    app.kubernetes.io/component: frontend
    app.kubernetes.io/environment: production
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: devops-monitor

  source:
    repoURL: https://github.com/vumanhcuongUET/devops-monitoring-tool
    targetRevision: main
    path: k8s/frontend
    kustomize:
      images:
        - name: devops-monitor-frontend
          newTag: production

  destination:
    server: https://kubernetes.default.svc
    namespace: devops-monitor-prod

  syncPolicy:
    automated:
      prune: false
      selfHeal: false
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
