---
# Redis Application
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-monitor-redis
  namespace: argocd
  labels:
    app.kubernetes.io/name: devops-monitor-redis
    app.kubernetes.io/component: cache
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: devops-monitor

  source:
    repoURL: https://github.com/vumanhcuongUET/devops-monitoring-tool
    targetRevision: master
    path: k8s/redis

  destination:
    server: https://kubernetes.default.svc
    namespace: devops-monitor

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true

---
# Redis Application (Production)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-monitor-redis-prod
  namespace: argocd
  labels:
    app.kubernetes.io/name: devops-monitor-redis-prod
    app.kubernetes.io/component: cache
    app.kubernetes.io/environment: production
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: devops-monitor

  source:
    repoURL: https://github.com/vumanhcuongUET/devops-monitoring-tool
    targetRevision: master
    path: k8s/redis

  destination:
    server: https://kubernetes.default.svc
    namespace: devops-monitor-prod

  syncPolicy:
    automated:
      prune: false
      selfHeal: false
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
