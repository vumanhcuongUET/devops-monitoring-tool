---
# ArgoCD Service Account for Server
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-server
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-server
    app.kubernetes.io/part-of: argocd

---
# ArgoCD Service Account for Repo Server
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-repo-server
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-repo-server
    app.kubernetes.io/part-of: argocd

---
# ArgoCD Service Account for Application Controller
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-application-controller
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-application-controller
    app.kubernetes.io/part-of: argocd

---
# ArgoCD Role for Application Controller
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-application-controller
  namespace: argocd
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
      - configmaps
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - pods
      - pods/log
    verbs:
      - get
      - list

---
# ArgoCD ClusterRole for Application Controller (manage all namespaces)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argocd-application-controller
rules:
  # Core API resources
  - apiGroups:
      - ""
    resources:
      - pods
      - pods/exec
      - pods/portforward
      - pods/log
      - services
      - services/status
      - endpoints
      - endpointslices
      - persistentvolumeclaims
      - persistentvolumeclaims/status
      - events
      - configmaps
      - secrets
      - secrets/finalizers
    verbs:
      - create
      - get
      - list
      - watch
      - update
      - patch
      - delete

  # Apps API resources
  - apiGroups:
      - apps
    resources:
      - deployments
      - deployments/scale
      - deployments/status
      - replicasets
      - replicasets/scale
      - replicasets/status
      - statefulsets
      - statefulsets/scale
      - statefulsets/status
      - daemonsets
      - daemonsets/scale
      - daemonsets/status
    verbs:
      - create
      - get
      - list
      - watch
      - update
      - patch
      - delete

  # Batch API resources
  - apiGroups:
      - batch
    resources:
      - jobs
      - jobs/status
      - cronjobs
      - cronjobs/status
    verbs:
      - create
      - get
      - list
      - watch
      - update
      - patch
      - delete

  # Networking API resources
  - apiGroups:
      - networking.k8s.io
    resources:
      - ingresses
      - ingresses/status
      - networkpolicies
    verbs:
      - create
      - get
      - list
      - watch
      - update
      - patch
      - delete

  # Autoscaling API
  - apiGroups:
      - autoscaling
    resources:
      - horizontalpodautoscalers
      - horizontalpodautoscalers/status
    verbs:
      - create
      - get
      - list
      - watch
      - update
      - patch
      - delete

  # Custom Resource Definitions
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
      - list
      - watch

  # ArgoCD Application API
  - apiGroups:
      - argoproj.io
    resources:
      - applications
      - applications/status
      - appprojects
      - appprojects/status
    verbs:
      - create
      - get
      - list
      - watch
      - update
      - patch
      - delete

---
# ArgoCD ClusterRoleBinding for Application Controller
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argocd-application-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argocd-application-controller
subjects:
  - kind: ServiceAccount
    name: argocd-application-controller
    namespace: argocd

---
# ArgoCD RoleBinding for Application Controller (argocd namespace)
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-application-controller
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argocd-application-controller
subjects:
  - kind: ServiceAccount
    name: argocd-application-controller
    namespace: argocd
