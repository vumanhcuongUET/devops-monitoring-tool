---
# ArgoCD Secret — TEMPLATE ONLY. DO NOT COMMIT REAL VALUES.
#
# SECURITY: a bcrypt admin password hash was previously committed to this file
# and must be considered burned. Rotate the ArgoCD admin password on every
# cluster that applied this file, then manage values out-of-band:
#   argocd account update-password          # rotate admin
#   kubectl -n argocd patch secret argocd-secret -p '{"stringData":{"admin.password":"<new bcrypt hash>","admin.passwordMtime":"<now>"}}'
#
# Preferred: let External Secrets Operator own this secret (see commented
# ExternalSecret below) and never store credentials in this repository.
apiVersion: v1
kind: Secret
metadata:
  name: argocd-secret
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-secret
    app.kubernetes.io/part-of: argocd
type: Opaque
stringData:
  # Leave empty here; provide via External Secrets / manual patch.
  # Generate hash: htpasswd -bnBC 10 "" '<password>' | tr -d ':\n' | sed 's/$2y/$2a/'
  admin.password: ""
  # GitHub webhook secret (optional, for automated sync)
  webhook.github.secret: ""

