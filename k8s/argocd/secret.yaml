---
# ArgoCD Secret for sensitive configuration
apiVersion: v1
kind: Secret
metadata:
  name: argocd-secret
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-secret
    app.kubernetes.io/part-of: argocd
type: Opaque
stringData:
  # Initial admin password (bcrypt hashed)
  # Default: argocd (change this!)
  # Generate with: htpasswd -bnBC 10 "" <password> | tr -d ':\n' | sed 's/$2y/$2a/'
  admin.password: "$2a$10$Z/5SBEY.hGNZ4hEBsK8.Ou/v4Nm4x8jV.m8kwXPE3N.jh2vRqVy.m"
  admin.passwordMtime: "2026-08-26T00:00:00Z"

  # GitHub webhook secret (optional, for automated sync)
  webhook.github.secret: "REPLACE_WITH_GITHUB_WEBHOOK_SECRET"

---
