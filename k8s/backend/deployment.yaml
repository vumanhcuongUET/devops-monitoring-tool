apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitor-backend
  namespace: devops-monitor
spec:
  # Phase 12 debt: 1 replica — AlertEngine + WS broadcast are in-process with no
  # leader election / pub-sub fanout; 2 replicas duplicate alerts and drop realtime
  # events (review H1, 2026-08-29). Split out an alert-worker when scaling is needed.
  replicas: 1
  selector:
    matchLabels:
      app: monitor-backend
  template:
    metadata:
      labels:
        app: monitor-backend
    spec:
      serviceAccountName: monitor-backend
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: your-registry/devops-monitor-backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: monitor-backend-config
            - secretRef:
                name: monitor-backend-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 30  # 5s * 30 = 150s total startup time
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: alert-data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: alert-data
          persistentVolumeClaim:
            claimName: alert-data-pvc
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alert-data-pvc
  namespace: devops-monitor
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
