apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitor-backend
  namespace: devops-monitor
spec:
  # H1 (Phase 12): scaling past 1 replica is now supported — flip
  # ALERT_STATE_USE_REDIS, APPROVAL_STATE_USE_REDIS, ALERT_ENGINE_LEADER_LOCK
  # and WS_FANOUT_USE_REDIS to "true" in monitor-backend-config and set
  # REDIS_HOST/REDIS_PASSWORD in monitor-backend-secrets first
  # (see docs/deployment-guide-k8s-swarm.md).
  # The data/ PVC is ReadWriteOnce: for >1 replica, switch it to RWX so the
  # alert-rule/SLO-config edit endpoints work on every pod.
  replicas: 1
  selector:
    matchLabels:
      app: monitor-backend
  template:
    metadata:
      labels:
        app: monitor-backend
    spec:
      serviceAccountName: monitor-backend
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          # Matches what CI builds and pushes: ghcr.io/${{ github.repository }}/backend
          # (.github/workflows/ci.yml build-and-push job; GHCR lowercases the owner).
          image: ghcr.io/vumanhcuonguet/devops-monitoring-tool/backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: monitor-backend-config
            - secretRef:
                name: monitor-backend-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 30  # 5s * 30 = 150s total startup time
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            # Phase 14 residual #2: readiness pings the live dependencies
            # (ES/Prometheus/K8s, Redis when configured) — /health stays
            # liveness-only. Worst case is ~2s (parallel 2s-capped probes),
            # inside timeoutSeconds below.
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: alert-data
              mountPath: /app/data
            - name: configs
              mountPath: /app/configs
            - name: tmp
              mountPath: /tmp
      volumes:
        # alert-data: durable file state (DATA_DIR=/app/data) — users, alert
        # rules/state/history, SLO configs, approvals, audit log.
        - name: alert-data
          persistentVolumeClaim:
            claimName: alert-data-pvc
        # configs: writable scratch for the config subsystem
        # (CONFIG_STORAGE_PATH=/app/configs) under the read-only root
        # filesystem. Ephemeral on pod recreation — the checked-in configs/
        # tree in the repo remains the source of truth.
        - name: configs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alert-data-pvc
  namespace: devops-monitor
spec:
  # ReadWriteOnce: correct for the default 1-replica deployment. Scaling the
  # backend past 1 replica (with ALERT_ENGINE_LEADER_LOCK/WS_FANOUT_USE_REDIS)
  # and wanting rule-edit endpoints on every pod needs ReadWriteMany — most
  # default StorageClasses are RWO-only, so switch deliberately:
  #   accessModes: ["ReadWriteMany"]   # requires an RWX-capable StorageClass
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
