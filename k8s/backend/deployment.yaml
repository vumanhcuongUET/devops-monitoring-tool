apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitor-backend
  namespace: devops-monitor
spec:
  # H1 (Phase 12): scaling past 1 replica is now supported — flip
  # ALERT_ENGINE_LEADER_LOCK and WS_FANOUT_USE_REDIS to "true" in
  # monitor-backend-config (Redis required; see docs/deployment-guide-k8s-swarm.md).
  # The data/ PVC is ReadWriteOnce: for >1 replica, switch it to RWX so the
  # alert-rule/SLO-config edit endpoints work on every pod.
  replicas: 1
  selector:
    matchLabels:
      app: monitor-backend
  template:
    metadata:
      labels:
        app: monitor-backend
    spec:
      serviceAccountName: monitor-backend
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: your-registry/devops-monitor-backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: monitor-backend-config
            - secretRef:
                name: monitor-backend-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 30  # 5s * 30 = 150s total startup time
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: alert-data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: alert-data
          persistentVolumeClaim:
            claimName: alert-data-pvc
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alert-data-pvc
  namespace: devops-monitor
spec:
  # ReadWriteOnce: correct for the default 1-replica deployment. Scaling the
  # backend past 1 replica (with ALERT_ENGINE_LEADER_LOCK/WS_FANOUT_USE_REDIS)
  # and wanting rule-edit endpoints on every pod needs ReadWriteMany — most
  # default StorageClasses are RWO-only, so switch deliberately:
  #   accessModes: ["ReadWriteMany"]   # requires an RWX-capable StorageClass
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
