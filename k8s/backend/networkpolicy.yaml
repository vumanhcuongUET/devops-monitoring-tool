# Network Policies for devops-monitor namespace
# Default deny all ingress and egress, then allow specific traffic

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: devops-monitor
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

---
# Allow ingress from ingress-nginx to backend
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-backend
  namespace: devops-monitor
spec:
  podSelector:
    matchLabels:
      app: monitor-backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8000
          protocol: TCP

---
# Allow ingress from ingress-nginx to frontend
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-frontend
  namespace: devops-monitor
spec:
  podSelector:
    matchLabels:
      app: monitor-frontend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 80
          protocol: TCP

---
# Allow backend egress to external services (ES, Prometheus, K8s API)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-egress
  namespace: devops-monitor
spec:
  podSelector:
    matchLabels:
      app: monitor-backend
  policyTypes:
    - Egress
  egress:
    # Allow DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Allow HTTPS to external services
    - to:
        - namespaceSelector: {}
      ports:
        - port: 443
          protocol: TCP
    # Allow HTTP to external services
    - to:
        - namespaceSelector: {}
      ports:
        - port: 80
          protocol: TCP
    # Allow to Elasticsearch (if in same cluster)
    - to:
        - podSelector:
            matchLabels:
              app: elasticsearch
      ports:
        - port: 9200
          protocol: TCP
    # Allow to Prometheus (if in same cluster)
    - to:
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - port: 9090
          protocol: TCP
    # Phase 16 P1-10: OTLP traces to the collector (separate namespace) —
    # without this rule spans are silently dropped by the default-deny policy.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: devops-monitoring
          podSelector:
            matchLabels:
              app: otel-collector
      ports:
        - port: 4317
          protocol: TCP
    # Phase 16 P1-9: policy evaluation against the OPA server (opa namespace).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: opa
      ports:
        - port: 8181
          protocol: TCP

---
# Phase 16 P1-11: backup CronJob pods (redis-backup-pod, alert-data-backup-pod)
# matched only default-deny-all — they could not resolve DNS or reach S3, so
# every run failed at its first line. Allow DNS + HTTPS egress for them.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backup-pod-egress
  namespace: devops-monitor
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - redis-backup-pod
          - alert-data-backup-pod
  policyTypes:
    - Egress
  egress:
    # Allow DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Allow HTTPS (S3 upload, package installation)
    - to:
        - namespaceSelector: {}
      ports:
        - port: 443
          protocol: TCP

---
# Allow frontend egress to backend
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-egress
  namespace: devops-monitor
spec:
  podSelector:
    matchLabels:
      app: monitor-frontend
  policyTypes:
    - Egress
  egress:
    # Allow to backend
    - to:
        - podSelector:
            matchLabels:
              app: monitor-backend
      ports:
        - port: 8000
          protocol: TCP
    # Allow DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
