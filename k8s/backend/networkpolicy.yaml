# Network Policies for devops-monitor namespace
# Default deny all ingress and egress, then allow specific traffic

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: devops-monitor
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

---
# Allow ingress from ingress-nginx to backend
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-backend
  namespace: devops-monitor
spec:
  podSelector:
    matchLabels:
      app: monitor-backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8000
          protocol: TCP

---
# Allow ingress from ingress-nginx to frontend
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-frontend
  namespace: devops-monitor
spec:
  podSelector:
    matchLabels:
      app: monitor-frontend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 80
          protocol: TCP

---
# Allow backend egress to external services (ES, Prometheus, K8s API)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-egress
  namespace: devops-monitor
spec:
  podSelector:
    matchLabels:
      app: monitor-backend
  policyTypes:
    - Egress
  egress:
    # Allow DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Allow HTTPS to external services
    - to:
        - namespaceSelector: {}
      ports:
        - port: 443
          protocol: TCP
    # Allow HTTP to external services
    - to:
        - namespaceSelector: {}
      ports:
        - port: 80
          protocol: TCP
    # Allow to Elasticsearch (if in same cluster)
    - to:
        - podSelector:
            matchLabels:
              app: elasticsearch
      ports:
        - port: 9200
          protocol: TCP
    # Allow to Prometheus (if in same cluster)
    - to:
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - port: 9090
          protocol: TCP

---
# Allow frontend egress to backend
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-egress
  namespace: devops-monitor
spec:
  podSelector:
    matchLabels:
      app: monitor-frontend
  policyTypes:
    - Egress
  egress:
    # Allow to backend
    - to:
        - podSelector:
            matchLabels:
              app: monitor-backend
      ports:
        - port: 8000
          protocol: TCP
    # Allow DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
