apiVersion: v1
kind: Secret
metadata:
  name: monitor-backend-secrets
  namespace: devops-monitor
type: Opaque
# IMPORTANT: This is a template only. DO NOT commit actual secrets to git.
# Use external-secrets operator, sealed-secrets, or SOPS for production.
# Generate secrets with:
#   python3 -c "import secrets; print('AUTH_SECRET=' + secrets.token_hex(32))"
#   python3 -c "import secrets; print('API_KEY=' + secrets.token_hex(32))"
stringData:
  ELASTICSEARCH_USERNAME: ""  # Set via external secret management
  ELASTICSEARCH_PASSWORD: ""  # Set via external secret management
  SLACK_WEBHOOK_URL: ""
  SMTP_HOST: ""
  SMTP_PORT: "587"
  SMTP_USER: ""
  SMTP_PASSWORD: ""
  ALERT_EMAIL_FROM: ""
  ALERT_WEBHOOK_URL: ""
  AUTH_SECRET: ""  # REQUIRED for production - generate with secrets.token_hex(32)
  API_KEYS: ""  # REQUIRED for production - comma-separated list
  # Redis (optional): only consumed when ALERT_STATE_USE_REDIS /
  # APPROVAL_STATE_USE_REDIS / ALERT_ENGINE_LEADER_LOCK / WS_FANOUT_USE_REDIS
  # are "true" in monitor-backend-config (i.e. before scaling >= 2 replicas).
  REDIS_HOST: ""  # CHANGE_ME - e.g. redis.monitoring.svc.cluster.local
  REDIS_PASSWORD: ""  # CHANGE_ME - omit/leave empty if Redis runs without auth
