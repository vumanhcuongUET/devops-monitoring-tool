---
# ExternalSecret for Backend Secrets
# Phase 9 - Sprint 3 - Day 11
#
# This manifest configures External Secrets Operator to sync secrets from
# an external secret manager (Vault, AWS Secrets Manager, etc.) to Kubernetes.
#
# Prerequisites:
# - External Secrets Operator installed in cluster
# - SecretStore configured with external provider credentials
# - Secrets stored in external provider with correct paths
#

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: backend-secrets
  namespace: devops-monitoring
  labels:
    app: devops-monitoring
    component: backend
spec:
  # Refresh interval for secret rotation
  refreshInterval: 1h

  # Reference to the SecretStore (Vault, AWS, etc.)
  secretStoreRef:
    name: vault-backend
    kind: SecretStore

  # Target Kubernetes Secret
  target:
    name: backend-secrets
    creationPolicy: Owner
    # Template for environment variable format
    template:
      type: Opaque
      data:
        # Elasticsearch credentials
        ELASTICSEARCH_URL: "{{ .ELASTICSEARCH_URL }}"
        ELASTICSEARCH_USERNAME: "{{ .ELASTICSEARCH_USERNAME | toString }}"
        ELASTICSEARCH_PASSWORD: "{{ .ELASTICSEARCH_PASSWORD | toString }}"

        # Prometheus credentials
        PROMETHEUS_URL: "{{ .PROMETHEUS_URL }}"
        PROMETHEUS_USERNAME: "{{ .PROMETHEUS_USERNAME | toString }}"
        PROMETHEUS_PASSWORD: "{{ .PROMETHEUS_PASSWORD | toString }}"

        # Anthropic/Claude API
        ANTHROPIC_API_KEY: "{{ .ANTHROPIC_API_KEY | toString }}"

        # Authentication
        AUTH_SECRET: "{{ .AUTH_SECRET | toString }}"
        API_KEYS: "{{ .API_KEYS | toString }}"

        # Slack webhooks
        SLACK_WEBHOOK_URL: "{{ .SLACK_WEBHOOK_URL }}"
        SLACK_APPROVAL_WEBHOOK_URL: "{{ .SLACK_APPROVAL_WEBHOOK_URL }}"
        SLACK_SIGNING_SECRET: "{{ .SLACK_SIGNING_SECRET | toString }}"

        # Teams webhooks
        TEAMS_WEBHOOK_URL: "{{ .TEAMS_WEBHOOK_URL }}"
        TEAMS_SIGNING_SECRET: "{{ .TEAMS_SIGNING_SECRET | toString }}"

        # SMTP
        SMTP_HOST: "{{ .SMTP_HOST }}"
        SMTP_USER: "{{ .SMTP_USER | toString }}"
        SMTP_PASSWORD: "{{ .SMTP_PASSWORD | toString }}"

  # Data mapping from external secrets
  data:
    # Elasticsearch
    - secretKey: ELASTICSEARCH_URL
      remoteRef:
        key: devops/monitoring/elasticsearch
        property: url
    - secretKey: ELASTICSEARCH_USERNAME
      remoteRef:
        key: devops/monitoring/elasticsearch
        property: username
    - secretKey: ELASTICSEARCH_PASSWORD
      remoteRef:
        key: devops/monitoring/elasticsearch
        property: password

    # Prometheus
    - secretKey: PROMETHEUS_URL
      remoteRef:
        key: devops/monitoring/prometheus
        property: url
    - secretKey: PROMETHEUS_USERNAME
      remoteRef:
        key: devops/monitoring/prometheus
        property: username
    - secretKey: PROMETHEUS_PASSWORD
      remoteRef:
        key: devops/monitoring/prometheus
        property: password

    # LLM
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: devops/monitoring/anthropic
        property: api_key

    # Auth
    - secretKey: AUTH_SECRET
      remoteRef:
        key: devops/monitoring/auth
        property: secret
    - secretKey: API_KEYS
      remoteRef:
        key: devops/monitoring/auth
        property: api_keys

    # Slack
    - secretKey: SLACK_WEBHOOK_URL
      remoteRef:
        key: devops/monitoring/slack
        property: webhook_url
    - secretKey: SLACK_APPROVAL_WEBHOOK_URL
      remoteRef:
        key: devops/monitoring/slack
        property: approval_webhook_url
    - secretKey: SLACK_SIGNING_SECRET
      remoteRef:
        key: devops/monitoring/slack
        property: signing_secret

    # Teams
    - secretKey: TEAMS_WEBHOOK_URL
      remoteRef:
        key: devops/monitoring/teams
        property: webhook_url
    - secretKey: TEAMS_SIGNING_SECRET
      remoteRef:
        key: devops/monitoring/teams
        property: signing_secret

    # SMTP
    - secretKey: SMTP_HOST
      remoteRef:
        key: devops/monitoring/smtp
        property: host
    - secretKey: SMTP_USER
      remoteRef:
        key: devops/monitoring/smtp
        property: user
    - secretKey: SMTP_PASSWORD
      remoteRef:
        key: devops/monitoring/smtp
        property: password


---
# ExternalSecret for Frontend Secrets
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: frontend-secrets
  namespace: devops-monitoring
  labels:
    app: devops-monitoring
    component: frontend
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: frontend-secrets
    creationPolicy: Owner
  data:
    # Frontend API endpoint (usually not secret, but can be environment-specific)
    - secretKey: VITE_API_URL
      remoteRef:
        key: devops/monitoring/frontend
        property: api_url


---
# ExternalSecret for Redis
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: redis-secrets
  namespace: devops-monitoring
  labels:
    app: devops-monitoring
    component: redis
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: redis-secrets
    creationPolicy: Owner
  data:
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: devops/monitoring/redis
        property: password
