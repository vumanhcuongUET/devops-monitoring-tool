---
# SecretStore Configuration for Vault
# Phase 9 - Sprint 3 - Day 11
#
# This SecretStore configures the External Secrets Operator to connect
# to HashiCorp Vault for secret retrieval.
#
# Prerequisites:
# - Vault server accessible from cluster
# - Kubernetes auth method configured in Vault
# - Service account with appropriate Vault policy
#

apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: devops-monitor
spec:
  provider:
    vault:
      # Vault server address
      server: "https://vault.internal.company.com:8200"

      # Vault path (usually "secret" for KV v2)
      path: "secret"

      # Kubernetes authentication
      auth:
        kubernetes:
          # Mount path of the Kubernetes auth method
          mountPath: "auth/kubernetes"

          # Vault role to use
          role: "devops-monitoring"

          # Service account reference
          serviceAccountRef:
            name: external-secrets-sa

      # Vault KV engine version
      version: "v2"


---
# Service Account for External Secrets
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-sa
  namespace: devops-monitor


---
# Role for SecretStore access (minimal permissions)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-reader
  namespace: devops-monitor
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]


---
# Role Binding
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secret-reader-binding
  namespace: devops-monitor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: secret-reader
subjects:
  - kind: ServiceAccount
    name: external-secrets-sa
    namespace: devops-monitor


---
# Example: Vault Policy for devops-monitoring role
# This should be configured in Vault, not Kubernetes
#
# policy.hcl:
# path "secret/data/devops/monitoring/*" {
#   capabilities = ["read", "list"]
# }
# path "secret/metadata/devops/monitoring/*" {
#   capabilities = ["read", "list"]
# }


