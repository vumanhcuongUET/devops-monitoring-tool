---
# Prometheus Custom Rules for DevOps Monitor
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus-rules
    app.kubernetes.io/component: monitoring
data:
  devops-monitor-rules.yaml: |
    groups:
      # API Availability Rules
      - name: api_availability
        interval: 30s
        rules:
          - alert: HighErrorRate
            expr: |
              sum(rate(http_requests_total{status=~"5.."}[5m])) by (service)
              /
              sum(rate(http_requests_total[5m])) by (service)
              > 0.05
            for: 5m
            labels:
              severity: high
              tier: api
            annotations:
              summary: "High error rate detected"
              description: "Service {{ $labels.service }} error rate is {{ $value | humanizePercentage }} (>5%)"
              runbook: "https://runbooks.example.com/high-error-rate"

          - alert: CriticalErrorRate
            expr: |
              sum(rate(http_requests_total{status=~"5.."}[2m])) by (service)
              /
              sum(rate(http_requests_total[2m])) by (service)
              > 0.10
            for: 2m
            labels:
              severity: critical
              tier: api
            annotations:
              summary: "Critical error rate detected"
              description: "Service {{ $labels.service }} error rate is {{ $value | humanizePercentage }} (>10%)"

      # API Latency Rules
      - name: api_latency
        interval: 30s
        rules:
          - alert: HighLatency
            expr: |
              histogram_quantile(0.95,
                sum(rate(http_request_duration_seconds_bucket[5m])) by (le, service)
              ) > 2
            for: 10m
            labels:
              severity: high
              tier: api
            annotations:
              summary: "High P95 latency detected"
              description: "Service {{ $labels.service }} P95 latency is {{ $value }}s (>2s)"
              runbook: "https://runbooks.example.com/high-latency"

          - alert: CriticalLatency
            expr: |
              histogram_quantile(0.99,
                sum(rate(http_request_duration_seconds_bucket[2m])) by (le, service)
              ) > 5
            for: 2m
            labels:
              severity: critical
              tier: api
            annotations:
              summary: "Critical P99 latency detected"
              description: "Service {{ $labels.service }} P99 latency is {{ $value }}s (>5s)"

      # SLO Violation Rules
      - name: slo_violations
        interval: 1m
        rules:
          - alert: SLOViolation
            expr: slo_budget_remaining < 0
            for: 5m
            labels:
              severity: critical
              tier: slo
            annotations:
              summary: "SLO violation detected"
              description: "Service {{ $labels.service }} SLO violated, budget: {{ $value }}%"
              runbook: "https://runbooks.example.com/slo-violation"

          - alert: SLOAtRisk
            expr: slo_budget_remaining < 10 and slo_budget_remaining > 0
            for: 15m
            labels:
              severity: warning
              tier: slo
            annotations:
              summary: "SLO at risk"
              description: "Service {{ $labels.service }} SLO budget at {{ $value }}% (<10%)"

          - alert: SLOWarnings
            expr: |
              sum(rate(http_slow_requests_total[5m])) by (service)
              /
              sum(rate(http_requests_total[5m])) by (service)
              > 0.01
            for: 10m
            labels:
              severity: warning
              tier: slo
            annotations:
              summary: "High slow request rate"
              description: "Service {{ $labels.service }} slow request rate is {{ $value | humanizePercentage }} (>1%)"

      # Resource Exhaustion Rules
      - name: resource_exhaustion
        interval: 30s
        rules:
          - alert: HighMemoryUsage
            expr: |
              container_memory_usage_bytes{namespace="devops-monitor"}
              /
              container_spec_memory_limit_bytes{namespace="devops-monitor"}
              > 0.9
            for: 5m
            labels:
              severity: high
              tier: infrastructure
            annotations:
              summary: "High memory usage"
              description: "Container {{ $labels.container }} in {{ $labels.pod }} using {{ $value | humanizePercentage }} of memory limit"
              runbook: "https://runbooks.example.com/high-memory-usage"

          - alert: CriticalMemoryUsage
            expr: |
              container_memory_usage_bytes{namespace="devops-monitor"}
              /
              container_spec_memory_limit_bytes{namespace="devops-monitor"}
              > 0.95
            for: 2m
            labels:
              severity: critical
              tier: infrastructure
            annotations:
              summary: "Critical memory usage"
              description: "Container {{ $labels.container }} in {{ $labels.pod }} using {{ $value | humanizePercentage }} of memory limit"

          - alert: HighCPUUsage
            expr: |
              sum(rate(container_cpu_usage_seconds_total{namespace="devops-monitor"}[5m])) by (pod)
              /
              sum(container_spec_cpu_quota{namespace="devops-monitor"}/container_spec_cpu_period{namespace="devops-monitor"}) by (pod)
              > 0.8
            for: 10m
            labels:
              severity: warning
              tier: infrastructure
            annotations:
              summary: "High CPU usage"
              description: "Pod {{ $labels.pod }} using {{ $value | humanizePercentage }} of CPU limit"

          - alert: DiskSpaceLow
            expr: |
              node_filesystem_avail_bytes{mountpoint="/var/lib/docker"}
              /
              node_filesystem_size_bytes{mountpoint="/var/lib/docker"}
              < 0.2
            for: 10m
            labels:
              severity: medium
              tier: infrastructure
            annotations:
              summary: "Disk space low"
              description: "Disk {{ $labels.device }} has {{ $value | humanizePercentage }} free space"
              runbook: "https://runbooks.example.com/disk-space-low"

          - alert: DiskSpaceCritical
            expr: |
              node_filesystem_avail_bytes{mountpoint="/var/lib/docker"}
              /
              node_filesystem_size_bytes{mountpoint="/var/lib/docker"}
              < 0.1
            for: 5m
            labels:
              severity: critical
              tier: infrastructure
            annotations:
              summary: "Critical disk space"
              description: "Disk {{ $labels.device }} has {{ $value | humanizePercentage }} free space"

      # Database Health Rules
      - name: database_health
        interval: 30s
        rules:
          - alert: PostgreSQLDown
            expr: pg_up == 0
            for: 1m
            labels:
              severity: critical
              tier: database
            annotations:
              summary: "PostgreSQL database down"
              description: "PostgreSQL instance {{ $labels.datname }} is not responding"

          - alert: PostgreSQLSlowQueries
            expr: |
              rate(pg_stat_database_calls_total{datname="devops_monitor"}[5m])
              /
              rate(pg_stat_database_calls_total{datname="devops_monitor"}[5m])
              > 0.05
            for: 10m
            labels:
              severity: warning
              tier: database
            annotations:
              summary: "PostgreSQL slow queries"
              description: "Slow query rate is {{ $value | humanizePercentage }}"

          - alert: PostgreSQLConnectionPoolExhausted
            expr: |
              pg_stat_activity_count
              /
              pg_settings_max_connections
              > 0.9
            for: 5m
            labels:
              severity: high
              tier: database
            annotations:
              summary: "PostgreSQL connection pool near capacity"
              description: "{{ $value | humanizePercentage }} of connections used"

          - alert: RedisDown
            expr: redis_up == 0
            for: 1m
            labels:
              severity: critical
              tier: cache
            annotations:
              summary: "Redis instance down"
              description: "Redis {{ $labels.addr }} is not responding"

          - alert: RedisMemoryHigh
            expr: |
              redis_memory_used_bytes
              /
              redis_memory_max_bytes
              > 0.9
            for: 5m
            labels:
              severity: high
              tier: cache
            annotations:
              summary: "Redis memory usage high"
              description: "Redis using {{ $value | humanizePercentage }} of max memory"

      # Application-Specific Rules
      - name: application_health
        interval: 30s
        rules:
          - alert: HighRateLimitHits
            expr: |
              sum(rate(rate_limit_hits_total[5m])) by (endpoint)
              > 10
            for: 5m
            labels:
              severity: warning
              tier: application
            annotations:
              summary: "High rate limit hits"
              description: "Endpoint {{ $labels.endpoint }} hitting rate limits frequently"

          - alert: ApprovalQueueBacklog
            expr: |
              approval_queue_length
              > 50
            for: 15m
            labels:
              severity: warning
              tier: application
            annotations:
              summary: "Approval queue backlog"
              description: "{{ $value }} approvals pending"

          - alert: AlertEngineLagging
            expr: |
              alert_evaluation_lag_seconds
              > 60
            for: 5m
            labels:
              severity: warning
              tier: application
            annotations:
              summary: "Alert evaluation lagging"
              description: "Alert engine lagging by {{ $value }}s"

          - alert: AlertQueueFull
            expr: |
              alert_queue_length
              /
              alert_queue_capacity
              > 0.9
            for: 5m
            labels:
              severity: high
              tier: application
            annotations:
              summary: "Alert queue near capacity"
              description: "Alert queue at {{ $value | humanizePercentage }} capacity"

      # External Dependency Rules
      - name: external_dependencies
        interval: 30s
        rules:
          - alert: ElasticsearchDown
            expr: elasticsearch_cluster_health_status{color="red"} == 1
            for: 2m
            labels:
              severity: critical
              tier: external
            annotations:
              summary: "Elasticsearch cluster unhealthy"
              description: "Elasticsearch cluster is in RED state"

          - alert: ElasticsearchSlow
            expr: elasticsearch_cluster_health_status{color="yellow"} == 1
            for: 10m
            labels:
              severity: warning
              tier: external
            annotations:
              summary: "Elasticsearch cluster degraded"
              description: "Elasticsearch cluster is in YELLOW state"

          - alert: PrometheusDown
            expr: up{job="prometheus"} == 0
            for: 2m
            labels:
              severity: critical
              tier: infrastructure
            annotations:
              summary: "Prometheus down"
              description: "Prometheus instance is not responding"

      # Pod Health Rules
      - name: pod_health
        interval: 30s
        rules:
          - alert: PodCrashLooping
            expr: |
              rate(kube_pod_container_status_restarts_total{namespace="devops-monitor"}[5m])
              > 0
            for: 10m
            labels:
              severity: high
              tier: infrastructure
            annotations:
              summary: "Pod crash looping"
              description: "Pod {{ $labels.pod }} is restarting frequently"

          - alert: PodNotReady
            expr: |
              sum(kube_pod_status_ready{namespace="devops-monitor", condition="true"})
              /
              sum(kube_pod_status_phase{namespace="devops-monitor", phase="Running"})
              < 0.8
            for: 5m
            labels:
              severity: high
              tier: infrastructure
            annotations:
              summary: "Pods not ready"
              description: "{{ $value | humanizePercentage }} of pods are not ready"

          - alert: DeploymentRolloutFailed
            expr: |
              kube_deployment_status_condition{namespace="devops-monitor", condition="Progressing", status="False"}
              > 0
            for: 10m
            labels:
              severity: high
              tier: infrastructure
            annotations:
              summary: "Deployment rollout failed"
              description: "Deployment {{ $labels.deployment }} failed to rollout"

      # Backup Rules
      - name: backup_health
        interval: 1m
        rules:
          - alert: BackupFailed
            expr: |
              max_over_time(kube_job_status_failed{namespace="devops-monitor", job_name=~".*backup.*"}[24h])
              > 0
            for: 5m
            labels:
              severity: high
              tier: operations
            annotations:
              summary: "Backup job failed"
              description: "Recent backup job failed"

          - alert: BackupStale
            expr: |
              time() - max(kube_job_status_completion_time{namespace="devops-monitor", job_name=~".*backup.*"})
              > 86400
            for: 10m
            labels:
              severity: critical
              tier: operations
            annotations:
              summary: "No recent backup"
              description: "Last successful backup was more than 24 hours ago"
