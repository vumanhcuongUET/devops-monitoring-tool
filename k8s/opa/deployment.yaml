---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opa-policies
  namespace: opa
  labels:
    app: opa
data:
  # Basic policy structure - will be populated with Rego policies
  system.rego: |
    package system

    import data.lib.lists

    main := {
      "allow": allow,
      "reasons": reasons,
    }

    allow := true
    reasons := []

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opa
  namespace: opa
  labels:
    app: opa
spec:
  replicas: 2
  selector:
    matchLabels:
      app: opa
  template:
    metadata:
      labels:
        app: opa
    spec:
      containers:
        - name: opa
          image: openpolicyagent/opa:latest-envoy
          args:
            - "run"
            - "--server"
            - "--addr=localhost:8181"
            - "--log-level=info"
            - "--set=decision_logs.console=true"
          ports:
            - containerPort: 8181
              name: http
          volumeMounts:
            - name: policies
              mountPath: /policies
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: 8181
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health?bundles=true
              port: 8181
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: policies
          configMap:
            name: opa-policies

---
apiVersion: v1
kind: Service
metadata:
  name: opa
  namespace: opa
  labels:
    app: opa
spec:
  ports:
    - port: 8181
      targetPort: 8181
      name: http
  selector:
    app: opa

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opa
  namespace: opa
