---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opa
  namespace: opa
  labels:
    app: opa
spec:
  replicas: 2
  selector:
    matchLabels:
      app: opa
  template:
    metadata:
      labels:
        app: opa
    spec:
      serviceAccountName: opa
      containers:
        - name: opa
          # Phase 16 P1-9: was openpolicyagent/opa:latest-envoy — the Envoy
          # gRPC plugin variant for a plain REST policy server, on a floating
          # tag. Pin the standard distribution instead.
          image: openpolicyagent/opa:1.6.0-static
          imagePullPolicy: IfNotPresent
          args:
            - "run"
            - "--server"
            # Phase 16 P1-9: was --addr=localhost:8181 — loopback inside the
            # pod, so the Service connected to nothing.
            - "--addr=0.0.0.0:8181"
            - "--log-level=info"
            - "--set=decision_logs.console=true"
            # Load the policies from the mounted ConfigMap (the mount existed
            # but the directory was never passed to `run`).
            - "/policies"
          ports:
            - containerPort: 8181
              name: http
          volumeMounts:
            - name: policies
              mountPath: /policies
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: 8181
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health?bundles=true
              port: 8181
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: policies
          configMap:
            # Defined in k8s/opa/policies-configmap.yaml (generated from
            # policies/opa/*.rego by scripts/sync-opa-policies.sh).
            name: opa-policies
---
apiVersion: v1
kind: Service
metadata:
  name: opa
  namespace: opa
  labels:
    app: opa
spec:
  ports:
    - port: 8181
      targetPort: 8181
      name: http
  selector:
    app: opa
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opa
  namespace: opa
