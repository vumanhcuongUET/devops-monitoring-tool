---
# PostgreSQL Backup CronJob
# Phase 15 rewrite: the previous version could never run — bash/aws missing
# from postgres:16-alpine, wrong namespace (devops-monitor) and service
# (postgres → actually postgres.postgres.svc), wrong secret names for this
# namespace, a double-.gz upload path, and literal "${VAR:-}" env values
# (k8s does not expand those). The database is the optional Phase 11 audit/
# approval mirror (DATABASE_ENABLED), so backups only matter when it is on.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: postgres
  labels:
    app.kubernetes.io/name: postgres-backup
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: devops-monitor
spec:
  # Run daily at 3 AM
  schedule: "0 3 * * *"
  suspend: false
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600

  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-backup-job
    spec:
      concurrencyPolicy: Forbid
      backoffLimit: 3
      activeDeadlineSeconds: 3600

      template:
        metadata:
          labels:
            app.kubernetes.io/name: postgres-backup-pod
        spec:
          restartPolicy: OnFailure
          serviceAccountName: backup-service-account
          containers:
            - name: backup
              # One image with BOTH pg_dump (postgresql16-client) and the
              # aws CLI; installed at start via apk (needs egress to the
              # Alpine CDN — pin this to a prebuilt image with both tools
              # when an internal registry is available).
              image: alpine:3.20
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  apk add --no-cache postgresql16-client aws-cli >/dev/null

                  until pg_isready -h postgres.postgres.svc -U "${PGUSER}"; do
                    echo "Waiting for PostgreSQL..."
                    sleep 2
                  done

                  # custom format is internally compressed — no gzip step
                  # (the old script uploaded a nonexistent .gz.gz)
                  BACKUP_DATE="$(date +%Y%m%d_%H%M%S)"
                  BACKUP_FILE="devops_monitor_${BACKUP_DATE}.dump"
                  echo "Starting backup: ${BACKUP_FILE}"

                  pg_dump -h postgres.postgres.svc -U "${PGUSER}" -d "${PGDATABASE}" \
                    --format=custom \
                    -f "/tmp/${BACKUP_FILE}"

                  BACKUP_SIZE="$(du -h "/tmp/${BACKUP_FILE}" | cut -f1)"
                  echo "Backup size: ${BACKUP_SIZE}"

                  if [ -n "${AWS_ACCESS_KEY_ID:-}" ]; then
                    echo "Uploading to S3..."
                    aws s3 cp "/tmp/${BACKUP_FILE}" \
                      "${S3_BUCKET}/${BACKUP_FILE}"
                  else
                    echo "AWS credentials not configured, skipping S3 upload"
                  fi

                  rm -f "/tmp/${BACKUP_FILE}"
                  echo "Backup completed successfully"

              env:
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: postgres-credentials
                      key: username
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-credentials
                      key: password
                - name: PGDATABASE
                  valueFrom:
                    secretKeyRef:
                      name: postgres-credentials
                      key: username  # bootstrap DB is named after the user
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: postgres-backup-credentials
                      key: aws-access-key-id
                      optional: true
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: postgres-backup-credentials
                      key: aws-secret-access-key
                      optional: true
                - name: AWS_DEFAULT_REGION
                  value: "us-east-1"  # k8s does not expand ${VAR:-default}
                - name: S3_BUCKET
                  value: "s3://devops-monitoring-backups/postgresql"

              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi

              volumeMounts:
                - name: tmp
                  mountPath: /tmp

          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 2Gi

---
# Backup ServiceAccount — S3 upload needs no Kubernetes RBAC at all (the old
# Role granted pods/exec + secrets read that this job never used).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backup-service-account
  namespace: postgres
