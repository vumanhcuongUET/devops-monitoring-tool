---
# PostgreSQL Secret
# NOTE: This is a template. Create the actual secret using:
# kubectl create secret generic postgres-credentials \
#   --from-literal=postgres-password=<password> \
#   --from-literal=password=<password> \
#   --from-literal=replication-password=<password> \
#   --namespace=postgres
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: postgres
type: Opaque
stringData:
  # Superuser password
  postgres-password: "CHANGE_ME_IN_PRODUCTION"
  # Application user password
  password: "CHANGE_ME_IN_PRODUCTION"
  # Replication password
  replication-password: "CHANGE_ME_IN_PRODUCTION"
  # AWS credentials for backup
  aws-access-key-id: ""
  aws-secret-access-key: ""
  aws-bucket: "devops-monitoring-backups"

---
# Backup credentials secret
apiVersion: v1
kind: Secret
metadata:
  name: postgres-backup-credentials
  namespace: postgres
type: Opaque
stringData:
  aws-access-key-id: ""
  aws-secret-access-key: ""
  aws-bucket: "devops-monitoring-backups"
  aws-region: "us-east-1"
