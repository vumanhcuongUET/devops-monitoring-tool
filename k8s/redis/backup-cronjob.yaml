---
# Redis Backup CronJob
# 2026-08-31 rewrite: the previous version could never succeed —
#   - image redis:7-alpine has no `aws` CLI the script calls,
#   - env values were literal "${AWS_REGION:-us-east-1}" strings (k8s does
#     not expand shell defaults),
#   - host `redis` resolved inside devops-monitor but Redis runs in the
#     `monitoring` namespace,
#   - the BGSAVE wait compared LASTSAVE to "0", so it broke out immediately
#     (LASTSAVE always returns the previous save epoch).
# Mirrors the Phase 15 PostgreSQL CronJob: alpine + runtime apk install of
# redis-cli and the aws CLI (swap to a prebuilt image when an internal
# registry exists), its own namespace-local ServiceAccount.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: redis-backup
  namespace: devops-monitor
  labels:
    app.kubernetes.io/name: redis-backup
    app.kubernetes.io/component: backup
spec:
  # Run every hour
  schedule: "0 * * * *"
  suspend: false
  successfulJobsHistoryLimit: 24
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600

  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: redis-backup-job
    spec:
      concurrencyPolicy: Forbid
      backoffLimit: 2
      activeDeadlineSeconds: 600

      template:
        metadata:
          labels:
            app.kubernetes.io/name: redis-backup-pod
        spec:
          restartPolicy: OnFailure
          serviceAccountName: backup-service-account

          containers:
            - name: backup
              image: alpine:3.20
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  apk add --no-cache redis aws-cli >/dev/null

                  # redis-cli reads the password from REDISCLI_AUTH. Only set
                  # it when non-empty — exporting "" makes redis-cli send
                  # `AUTH ""`, which errors and spins the PING loop forever.
                  if [ -n "${REDIS_PASSWORD:-}" ]; then
                    export REDISCLI_AUTH="${REDIS_PASSWORD}"
                  fi
                  RHOST="redis.monitoring.svc.cluster.local"

                  until redis-cli -h "${RHOST}" PING >/dev/null 2>&1; do
                    echo "Waiting for Redis..."
                    sleep 2
                  done

                  BACKUP_DATE=$(date +%Y%m%d_%H%M%S)
                  BACKUP_FILE="redis_dump_${BACKUP_DATE}.rdb.gz"

                  echo "Starting Redis backup: ${BACKUP_FILE}"

                  # BGSAVE, then wait for LASTSAVE epoch to actually advance.
                  LASTSAVE_BEFORE=$(redis-cli -h "${RHOST}" LASTSAVE)
                  redis-cli -h "${RHOST}" BGSAVE
                  SAVE_DONE=0
                  for i in $(seq 1 60); do
                    LASTSAVE_NOW=$(redis-cli -h "${RHOST}" LASTSAVE)
                    if [ "${LASTSAVE_NOW}" != "${LASTSAVE_BEFORE}" ]; then
                      SAVE_DONE=1
                      break
                    fi
                    echo "Waiting for BGSAVE... (${i}/60)"
                    sleep 1
                  done
                  [ "${SAVE_DONE}" = "1" ] || { echo "BGSAVE timeout!"; exit 1; }

                  # Direct RDB copy, then compress.
                  redis-cli -h "${RHOST}" --rdb /tmp/dump.rdb >/dev/null
                  gzip /tmp/dump.rdb
                  mv /tmp/dump.rdb.gz "/tmp/${BACKUP_FILE}"
                  echo "Backup size: $(du -h "/tmp/${BACKUP_FILE}" | cut -f1)"

                  # Upload to S3 (plain env values — k8s does not expand ${}).
                  if [ -n "${AWS_ACCESS_KEY_ID}" ] && [ -n "${AWS_SECRET_ACCESS_KEY}" ]; then
                    aws s3 cp "/tmp/${BACKUP_FILE}" "${S3_BUCKET}/${BACKUP_FILE}"
                    echo "Upload successful"
                  else
                    echo "AWS credentials not configured, backup kept locally only" >&2
                    exit 1
                  fi

                  # Retention: delete uploads older than RETENTION_DAYS.
                  # `aws s3 ls` lines look like: "2026-08-31 12:00:00 1234 file"
                  # — the DATE is field 1, stripped of dashes for comparison.
                  CUTOFF_DATE=$(date -d "${RETENTION_DAYS} days ago" +%Y%m%d)
                  aws s3 ls "${S3_BUCKET}/" | while read -r _date _time _size fname; do
                    [ -n "${fname:-}" ] || continue
                    FILE_DATE=$(echo "${_date}" | tr -d '-')
                    if [ "${FILE_DATE}" -lt "${CUTOFF_DATE}" ] 2>/dev/null; then
                      echo "Deleting old backup: ${fname}"
                      aws s3 rm "${S3_BUCKET}/${fname}"
                    fi
                  done

                  rm -f "/tmp/${BACKUP_FILE}"
                  echo "Redis backup completed successfully"

              env:
                - name: REDIS_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: redis-backup-auth
                      key: redis-password
                      optional: true

                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: backup-aws-credentials
                      key: access-key-id
                      optional: true

                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: backup-aws-credentials
                      key: secret-access-key
                      optional: true

                - name: AWS_DEFAULT_REGION
                  value: "us-east-1"

                - name: S3_BUCKET
                  value: "s3://devops-monitoring-backups/redis"

                - name: RETENTION_DAYS
                  value: "7"

              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 256Mi

              volumeMounts:
                - name: tmp
                  mountPath: /tmp

          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 1Gi

---
# Namespace-local backup SA — the postgres namespace copy is not visible here.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backup-service-account
  namespace: devops-monitor
  labels:
    app.kubernetes.io/name: redis-backup
    app.kubernetes.io/component: backup
