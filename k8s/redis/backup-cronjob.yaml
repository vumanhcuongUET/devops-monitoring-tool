---
# Redis Backup CronJob
apiVersion: batch/v1
kind: CronJob
metadata:
  name: redis-backup
  namespace: devops-monitor
  labels:
    app.kubernetes.io/name: redis-backup
    app.kubernetes.io/component: backup
spec:
  # Run every hour
  schedule: "0 * * * *"
  suspend: false
  successfulJobsHistoryLimit: 24
  failedJobsHistoryLimit: 3

  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: redis-backup-job
    spec:
      concurrencyPolicy: Forbid
      backoffLimit: 2
      activeDeadlineSeconds: 600

      template:
        metadata:
          labels:
            app.kubernetes.io/name: redis-backup-pod
        spec:
          restartPolicy: OnFailure

          serviceAccountName: backup-service-account

          containers:
            - name: backup
              image: redis:7-alpine
              command:
                - /bin/sh
                - -c
                - |
                  BACKUP_DATE=$(date +%Y%m%d_%H%M%S)
                  BACKUP_FILE="redis_dump_${BACKUP_DATE}.rdb"

                  echo "Starting Redis backup: ${BACKUP_FILE}"

                  # Trigger BGSAVE
                  redis-cli -h redis BGSAVE

                  # Wait for BGSAVE to complete
                  SAVE_DONE=0
                  for i in $(seq 1 60); do
                    LASTSAVE=$(redis-cli -h redis LASTSAVE)
                    if [ "${LASTSAVE}" != "0" ]; then
                      SAVE_DONE=1
                      break
                    fi
                    echo "Waiting for BGSAVE... (${i}/60)"
                    sleep 1
                  done

                  if [ "${SAVE_DONE}" != "1" ]; then
                    echo "BGSAVE timeout!"
                    exit 1
                  fi

                  echo "BGSAVE completed"

                  # Copy RDB file
                  redis-cli -h redis --rdb /tmp/${BACKUP_FILE}

                  # Compress
                  gzip /tmp/${BACKUP_FILE}
                  BACKUP_FILE="${BACKUP_FILE}.gz"

                  # Get size
                  BACKUP_SIZE=$(du -h /tmp/${BACKUP_FILE} | cut -f1)
                  echo "Backup size: ${BACKUP_SIZE}"

                  # Upload to S3
                  if [ -n "${AWS_ACCESS_KEY_ID:-}" ]; then
                    echo "Uploading to S3..."
                    aws s3 cp /tmp/${BACKUP_FILE} \
                      ${S3_BUCKET:-s3://devops-monitoring-backups/redis}/${BACKUP_FILE}

                    if [ $? -eq 0 ]; then
                      echo "Upload successful"
                    else
                      echo "Upload failed"
                      exit 1
                    fi
                  else
                    echo "AWS credentials not configured, skipping S3 upload"
                  fi

                  # Cleanup
                  rm -f /tmp/${BACKUP_FILE}

                  echo "Redis backup completed successfully"

              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: backup-aws-credentials
                      key: access-key-id
                      optional: true

                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: backup-aws-credentials
                      key: secret-access-key
                      optional: true

                - name: AWS_DEFAULT_REGION
                  value: "${AWS_REGION:-us-east-1}"

                - name: S3_BUCKET
                  value: "${S3_BUCKET:-s3://devops-monitoring-backups/redis}"

              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 256Mi

              volumeMounts:
                - name: tmp
                  mountPath: /tmp

          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 1Gi
