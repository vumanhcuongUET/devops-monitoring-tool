# Kubernetes Secrets Management with HashiCorp Vault
#
# This configuration deploys Vault for secure secrets management
# with auto-unseal, HA storage, and Kubernetes authentication.
#
# Phase 7: Production Hardening - Week 5, Day 24-25

---
# Namespace for Vault
apiVersion: v1
kind: Namespace
metadata:
  name: vault
  labels:
    name: vault
    security: "sensitive"

---
# Vault Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault
  namespace: vault

---
# Vault ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-config
  namespace: vault
data:
  vault.hcl: |
    # HA Storage Backend
    storage "consul" {
      path = "vault"
      address = "consul.consul.svc.cluster.local:8500"
      scheme = "https"
      tls_ca_file = "/etc/vault/tls/ca.crt"
      tls_cert_file = "/etc/vault/tls/client.crt"
      tls_key_file = "/etc/vault/tls/client.key"
    }

    # Listener
    listener "tcp" {
      address = "0.0.0.0:8200"
      cluster_address = "0.0.0.0:8201"
      tls_cert_file = "/etc/vault/tls/server.crt"
      tls_key_file = "/etc/vault/tls/server.key"
      tls_client_ca_file = "/etc/vault/tls/ca.crt"
      tls_min_version = "tls12"
      tls_prefer_server_cipher_suites = "false"
    }

    # API
    api_addr = "https://vault.vault.svc:8200"
    cluster_addr = "https://vault.vault.svc:8201"

    # Seal (for HA)
    seal "awskms" {
      region = "us-east-1"
      kms_key_id = "arn:aws:kms:us-east-1:XXXXXXXXXXXX:key/XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX"
    }

    # K8s Authentication
    ui = true

    # Cluster
    cluster {
      name = "vault-cluster"
      enabled = true
      ttl = "1h"
    }

---
# Vault StatefulSet (HA deployment)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vault
  namespace: vault
spec:
  serviceName: vault
  replicas: 3
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
    spec:
      serviceAccountName: vault
      containers:
      - name: vault
        image: hashicorp/vault:1.15.4
        ports:
        - containerPort: 8200
          name: http
        - containerPort: 8201
          name: cluster
        env:
        - name: VAULT_ADDR
          value: "https://127.0.0.1:8200"
        - name: VAULT_API_ADDR
          value: "https://vault.vault.svc:8200"
        - name: VAULT_CLUSTER_ADDR
          value: "https://vault.vault.svc:8201"
        - name: SKIP_SETCAP
          value: "false"
        - name: HOME
          value: /home/vault
        - name: VAULT_UI
          value: "true"
        securityContext:
          runAsUser: 100
          runAsGroup: 1000
          capabilities:
            add:
            - IPC_LOCK
            drop:
            - ALL
        volumeMounts:
        - name: vault-config
          mountPath: /etc/vault
          readOnly: true
        - name: vault-data
          mountPath: /vault/data
        - name: vault-tls
          mountPath: /etc/vault/tls
          readOnly: true
        command:
        - "/bin/sh"
        - "-ecx"
        - |
          # Check if Vault is already initialized
          if [ -f /vault/data/init ]; then
            echo "Vault already initialized, starting..."
            exec vault server -config=/etc/vault/vault.hcl
          else
            echo "Initializing Vault..."
            # Initialize Vault (will be done manually or via init container)
            touch /vault/data/init
            exec vault server -config=/etc/vault/vault.hcl
          fi
        livenessProbe:
          httpGet:
            path: /v1/sys/health
            port: 8200
            scheme: HTTPS
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /v1/sys/health
            port: 8200
            scheme: HTTPS
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: vault-config
        configMap:
          name: vault-config
          items:
          - key: vault.hcl
            path: vault.hcl
      - name: vault-tls
        secret:
          secretName: vault-tls
          optional: true
  volumeClaimTemplates:
  - metadata:
      name: vault-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: gp3-encrypted
      resources:
        requests:
          storage: 10Gi

---
# Vault Service (ClusterIP for internal)
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: vault
spec:
  type: ClusterIP
  ports:
  - port: 8200
    name: http
    targetPort: 8200
  - port: 8201
    name: cluster
    targetPort: 8201
  selector:
    app: vault

---
# Vault Service (LoadBalancer for external access - optional)
apiVersion: v1
kind: Service
metadata:
  name: vault-lb
  namespace: vault
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-internal: "true"
spec:
  type: LoadBalancer
  ports:
  - port: 8200
    name: http
    targetPort: 8200
  selector:
    app: vault

---
# Pod Disruption Budget for Vault
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: vault-pdb
  namespace: vault
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: vault

---
# Network Policy for Vault
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vault-netpol
  namespace: vault
spec:
  podSelector:
    matchLabels:
      app: vault
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow from ingress controller
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8200
  # Allow from other namespaces that need secrets
  - from:
    - namespaceSelector:
        matchLabels:
          secrets-access: "allowed"
    ports:
    - protocol: TCP
      port: 8200
  egress:
  # Allow DNS
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
    ports:
    - protocol: UDP
      port: 53
  # Allow HTTPS to Consul
  - to:
    - namespaceSelector:
        matchLabels:
          name: consul
    ports:
    - protocol: TCP
      port: 8501
  # Allow external API calls (AWS KMS, etc)
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443

---
# External Secrets Operator Deployment
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets

---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: HelmRepository
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 1h
  url: https://charts.external-secrets.io/

---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 1h
  chart:
    spec:
      chart: external-secrets
      version: "0.9.x"
      sourceRef:
        kind: HelmRepository
        name: external-secrets
  values:
    installCRDs: true

---
# Example ExternalSecret (backend database credentials)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: backend-database-credentials
  namespace: backend
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: database-credentials
    creationPolicy: Owner
  data:
  - secretKey: database-url
    remoteRef:
      key: secret/backend/database
      property: url
  - secretKey: database-username
    remoteRef:
      key: secret/backend/database
      property: username
  - secretKey: database-password
    remoteRef:
      key: secret/backend/database
      property: password

---
# SecretStore for Vault backend
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: backend
spec:
  provider:
    vault:
      server: "https://vault.vault.svc:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "auth/kubernetes"
          role: "external-secrets"

---
# SealedSecrets Controller (alternative approach)
apiVersion: v1
kind: Namespace
metadata:
  name: sealed-secrets

---
# SealedSecret controller (bitnami)
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: sealed-secrets-controller
  namespace: sealed-secrets
spec:
  interval: 1h
  chart:
    spec:
      chart: sealed-secrets
      version: "2.x"
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
  values:
    image:
      repository: bitnami/sealed-secrets-controller
      tag: "0.24.0"
