---
# Staging Operator Service Account
# Purpose: Edit access to staging resources for safe operations
# Environment: Staging
# Permissions: view + modify + create (no delete on critical resources)

apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-agent-staging-operator
  namespace: ai-agents
  labels:
    environment: staging
    access-level: operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-agent-staging-operator-role
  namespace: ai-agents
  labels:
    environment: staging
    access-level: operator
rules:
  # Core API - full access in ai-agents namespace
  # pods/exec intentionally NOT granted: combined with secrets
  # create/update/patch it equals code-execution + credential ownership in
  # the namespace. Re-add temporarily only with an audit note.
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - pods/status
      - services
      - configmaps
      - secrets
      - persistentvolumeclaims
    verbs: ["get", "list", "watch", "create", "update", "patch"]

  # No delete on PVCs
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ai-agent-staging-operator-cluster-role
  labels:
    environment: staging
    access-level: operator
rules:
  # Core API - read-only outside ai-agents
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - pods/status
      - services
      - configmaps
      - persistentvolumeclaims
      - events
      - namespaces
    verbs: ["get", "list", "watch"]

  # Apps API - READ-ONLY outside ai-agents. This is a ClusterRole, so write
  # verbs here would grant modify rights across every namespace; staging
  # writes belong in the namespaced Role above.
  - apiGroups: ["apps"]
    resources:
      - deployments
      - deployments/scale
      - deployments/status
      - statefulsets
      - statefulsets/scale
      - statefulsets/status
      - daemonsets
      - replicasets
    verbs: ["get", "list", "watch"]

  # Batch API - read-only outside ai-agents
  - apiGroups: ["batch"]
    resources:
      - jobs
      - jobs/status
      - cronjobs
      - cronjobs/status
    verbs: ["get", "list", "watch"]

  # Autoscaling - read-only outside ai-agents
  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
      - horizontalpodautoscalers/status
    verbs: ["get", "list", "watch"]

  # Networking - read-only outside ai-agents
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
      - ingresses/status
      - networkpolicies
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-agent-staging-operator-binding
  labels:
    environment: staging
subjects:
  - kind: ServiceAccount
    name: ai-agent-staging-operator
    namespace: ai-agents
roleRef:
  kind: ClusterRole
  name: ai-agent-staging-operator-cluster-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-agent-staging-operator-ns-binding
  namespace: ai-agents
subjects:
  - kind: ServiceAccount
    name: ai-agent-staging-operator
    namespace: ai-agents
roleRef:
  kind: Role
  name: ai-agent-staging-operator-role
  apiGroup: rbac.authorization.k8s.io
