---
# Backend Deployment for Staging Environment
# Includes Phase 8 Security & Safety Features
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-staging
  namespace: devops-monitor-staging
  labels:
    app: backend
    environment: staging
    version: v1.0.0-phase8
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
      environment: staging
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: backend
        environment: staging
        version: v1.0.0-phase8
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: backend-staging-operator
      automountServiceAccountToken: false

      # Security context for pod
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      containers:
      - name: backend
        image: devops-monitor-backend:v1.0.0-phase8
        imagePullPolicy: IfNotPresent

        ports:
        - name: http
          containerPort: 8000
          protocol: TCP

        # Security context for container
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"

        # Liveness probe
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        # Readiness probe
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2

        # Startup probe
        startupProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 12

        env:
        # Core configuration
        - name: ENVIRONMENT
          value: "staging"
        - name: LOG_LEVEL
          value: "INFO"

        # Database
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: backend-secrets-staging
              key: database-url

        # Elasticsearch
        - name: ELASTICSEARCH_URL
          valueFrom:
            secretKeyRef:
              name: backend-secrets-staging
              key: elasticsearch-url
        - name: ELASTICSEARCH_USERNAME
          valueFrom:
            secretKeyRef:
              name: backend-secrets-staging
              key: elasticsearch-username
        - name: ELASTICSEARCH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: backend-secrets-staging
              key: elasticsearch-password

        # Prometheus
        - name: PROMETHEUS_URL
          valueFrom:
            secretKeyRef:
              name: backend-secrets-staging
              key: prometheus-url
        - name: PROMETHEUS_AUTH
          valueFrom:
            secretKeyRef:
              name: backend-secrets-staging
              key: prometheus-auth

        # Kubernetes
        - name: KUBECONFIG_PATH
          value: ""  # Empty = in-cluster config
        - name: K8S_NAMESPACES
          value: '["devops-monitor-staging", "meinvoice-staging"]'

        # Phase 8: Rate Limiting
        - name: RATE_LIMIT_MAX_PER_HOUR
          value: "10"  # Higher limit for staging
        - name: RATE_LIMIT_COOLDOWN_SECONDS
          value: "60"  # Shorter cooldown for testing
        - name: RATE_LIMIT_EMERGENCY_BYPASS
          value: "false"

        # Phase 8: Action Chaining
        - name: RATE_LIMIT_MAX_CHAIN_LENGTH
          value: "5"  # Higher limit for testing
        - name: RATE_LIMIT_CHAIN_BREAK_SECONDS
          value: "600"

        # Phase 8: Time Windows
        - name: SAFE_HOURS_START
          value: "06:00"
        - name: SAFE_HOURS_END
          value: "22:00"
        - name: SAFE_HOURS_TIMEZONE
          value: "UTC"

        # Phase 8: Resource Limits
        - name: RESOURCE_CHECK_CPU_THRESHOLD_PERCENT
          value: "20.0"
        - name: RESOURCE_CHECK_MEMORY_THRESHOLD_PERCENT
          value: "20.0"

        # Phase 8: Teams Webhook
        - name: TEAMS_WEBHOOK_URL
          valueFrom:
            secretKeyRef:
              name: backend-secrets-staging
              key: teams-webhook-url
          optional: true

        # Phase 8: Security
        - name: SECURITY_CSP_USE_NONCE
          value: "true"

        # Notifications
        - name: SLACK_WEBHOOK_URL
          valueFrom:
            secretKeyRef:
              name: backend-secrets-staging
              key: slack-webhook-url
          optional: true

        # Volume mounts
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /app/cache

      volumes:
      - name: tmp
        emptyDir: {}
      - name: cache
        emptyDir:
          sizeLimit: "100Mi"

      # Node affinity for staging
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - backend
              topologyKey: kubernetes.io/hostname

---
# Backend Service for Staging
apiVersion: v1
kind: Service
metadata:
  name: backend-staging
  namespace: devops-monitor-staging
  labels:
    app: backend
    environment: staging
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8000
    targetPort: http
    protocol: TCP
  selector:
    app: backend
    environment: staging

---
# Horizontal Pod Autoscaler for Staging
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-staging-hpa
  namespace: devops-monitor-staging
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend-staging
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30

---
# Pod Disruption Budget for Staging
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend-staging-pdb
  namespace: devops-monitor-staging
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: backend
      environment: staging
