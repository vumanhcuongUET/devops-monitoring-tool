---
# Frontend Deployment for Staging Environment
# Includes Phase 8 Security Features
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-staging
  namespace: devops-monitor-staging
  labels:
    app: frontend
    environment: staging
    version: v1.0.0-phase8
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
      environment: staging
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: frontend
        environment: staging
        version: v1.0.0-phase8
    spec:
      serviceAccountName: frontend-staging
      automountServiceAccountToken: false

      # Security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      containers:
      - name: frontend
        image: devops-monitor-frontend:v1.0.0-phase8
        imagePullPolicy: IfNotPresent

        ports:
        - name: http
          containerPort: 3000
          protocol: TCP

        # Security context for container
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL

        env:
        - name: ENVIRONMENT
          value: "staging"
        - name: VITE_API_BASE_URL
          value: "http://backend-staging:8000"
        - name: VITE_WS_BASE_URL
          value: "ws://backend-staging:8000"

        # Phase 8: Frontend Authentication
        - name: VITE_TOKEN_LIFETIME_MINUTES
          value: "10"
        - name: VITE_REFRESH_BEFORE_EXPIRY_MINUTES
          value: "5"

        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"

        # Liveness probe
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        # Readiness probe
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2

        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /.cache

      volumes:
      - name: tmp
        emptyDir: {}
      - name: cache
        emptyDir:
          sizeLimit: "50Mi"

---
# Frontend Service for Staging
apiVersion: v1
kind: Service
metadata:
  name: frontend-staging
  namespace: devops-monitor-staging
  labels:
    app: frontend
    environment: staging
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 3000
    targetPort: http
    protocol: TCP
  selector:
    app: frontend
    environment: staging

---
# Horizontal Pod Autoscaler for Frontend
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend-staging-hpa
  namespace: devops-monitor-staging
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend-staging
  minReplicas: 2
  maxReplicas: 4
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
