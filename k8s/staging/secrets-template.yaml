---
# Secrets Template for Staging Environment
# IMPORTANT: Create actual secrets using: kubectl create secret generic
# This file is for documentation purposes only

apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets-staging
  namespace: devops-monitor-staging
type: Opaque
stringData:
  # Database connection
  database-url: "postgresql://user:password@postgres-staging:5432/devops_monitor_staging"

  # Elasticsearch
  elasticsearch-url: "https://elasticsearch-staging:9200"
  elasticsearch-username: "elastic"
  elasticsearch-password: "changeme"

  # Prometheus
  prometheus-url: "http://prometheus-staging:9090"
  prometheus-auth: "basic_auth_base64_encoded"

  # Teams Webhook (optional)
  teams-webhook-url: "https://outlook.office.com/webhook/uuid"

  # Slack Webhook (optional)
  slack-webhook-url: "https://hooks.slack.com/services/id"

  # Slack Signing Secret (for webhook verification)
  slack-signing-secret: "your_slack_signing_secret"

---
# Command to create the actual secret:
# kubectl create secret generic backend-secrets-staging \
#   --from-literal=database-url='...' \
#   --from-literal=elasticsearch-url='...' \
#   --from-literal=elasticsearch-username='...' \
#   --from-literal=elasticsearch-password='...' \
#   --from-literal=prometheus-url='...' \
#   --from-literal=prometheus-auth='...' \
#   --namespace=devops-monitor-staging
