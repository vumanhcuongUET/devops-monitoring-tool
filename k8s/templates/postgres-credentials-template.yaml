---
# PostgreSQL Secret
# NOTE: Lives OUTSIDE k8s/postgresql/ — that directory is an ArgoCD sync
# target (selfHeal:true), so shipping the Secret there would (a) overwrite
# real out-of-band values with these empties on every sync and (b) crashloop
# a fresh postgres (image refuses empty POSTGRES_PASSWORD). Create the real
# Secret out-of-band:
# NOTE: This is a template. Create the actual secret using:
# kubectl create secret generic postgres-credentials \
#   --from-literal=postgres-password=<password> \
#   --from-literal=password=<password> \
#   --from-literal=replication-password=<password> \
#   --namespace=postgres
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: postgres
type: Opaque
stringData:
  # Superuser password
  postgres-password: ""
  # Application user password
  password: ""
  # Replication password
  replication-password: ""
  # AWS credentials for backup
  aws-access-key-id: ""
  aws-secret-access-key: ""
  aws-bucket: "devops-monitoring-backups"

---
# Backup credentials secret
apiVersion: v1
kind: Secret
metadata:
  name: postgres-backup-credentials
  namespace: postgres
type: Opaque
stringData:
  aws-access-key-id: ""
  aws-secret-access-key: ""
  aws-bucket: "devops-monitoring-backups"
  aws-region: "us-east-1"
