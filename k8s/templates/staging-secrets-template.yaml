---
# Secrets Template for Staging Environment
# TEMPLATE ONLY — every value below is empty and MUST be provided out-of-band.
# Deploying with the placeholder values that used to live here ("changeme",
# "user:password") is what this template exists to prevent.
#
# Create the real secret with kubectl (never commit it), e.g.:
#
# kubectl create secret generic backend-secrets-staging \
#   --from-literal=database-url='postgresql://<user>:<pass>@postgres-staging:5432/devops_monitor_staging' \
#   --from-literal=elasticsearch-url='https://elasticsearch-staging:9200' \
#   --from-literal=elasticsearch-username='elastic' \
#   --from-literal=elasticsearch-password='<generated>' \
#   --from-literal=prometheus-url='http://prometheus-staging:9090' \
#   --from-literal=prometheus-auth='<base64 user:pass>' \
#   --namespace=devops-monitor-staging
#
# Lives OUTSIDE k8s/staging/ deliberately: the staging ArgoCD Application
# syncs that directory with selfHeal+prune, so a template here would
# overwrite the real out-of-band Secret on every sync.
# scripts/deploy-staging.sh sources $HOME/.staging-secrets and never applies this file.

apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets-staging
  namespace: devops-monitor-staging
  annotations:
    deploy.devops-monitor/template: "true"
type: Opaque
stringData:
  database-url: ""
  elasticsearch-url: ""
  elasticsearch-username: ""
  elasticsearch-password: ""
  prometheus-url: ""
  prometheus-auth: ""
  teams-webhook-url: ""
  slack-webhook-url: ""
  slack-signing-secret: ""
